# Builds and publishes the web services image (gateway): the Go gateway
# binary with the embedded web bundle, the built curriculum bundle and the
# web fonts, on distroless. Pushed to ghcr.io/<owner>/<repo>/gateway on
# pushes to main (tags: main, main-<sha>, latest) and on release tags through
# release.yml (tags: X.Y.Z, X.Y, latest). Pull requests build and smoke-test
# without pushing.
name: Web services image

on:
  push:
    branches: [main]
    paths:
      - web/**
      - cmd/gateway/**
      - cmd/playctl/**
      - internal/**
      - curriculum/**
      - images/gateway/**
      - go.mod
      - go.sum
      - .github/workflows/image-web.yml
  pull_request:
    paths:
      - web/**
      - cmd/gateway/**
      - cmd/playctl/**
      - internal/**
      - curriculum/**
      - images/gateway/**
      - go.mod
      - go.sum
      - .github/workflows/image-web.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: true
  workflow_call:
    inputs:
      push:
        type: boolean
        default: true

concurrency:
  group: image-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  gateway:
    name: gateway image
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to push
        id: decide
        run: |
          push=false
          case "${{ github.event_name }}" in
            push) push=true ;;
            workflow_dispatch|workflow_call) push='${{ inputs.push }}' ;;
          esac
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Version from git
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.decide.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}/gateway
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Emacs Playground gateway
            org.opencontainers.image.description=Gateway with the embedded web app, curriculum bundle and fonts
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.decide.outputs.push == 'true' }}
          load: ${{ steps.decide.outputs.push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ steps.decide.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.decide.outputs.push == 'true' }}

      - name: Smoke test (starts in local mode, serves health and the curriculum)
        run: |
          if [ '${{ steps.decide.outputs.push }}' = true ]; then
            ref='${{ env.IMAGE_BASE }}/gateway@${{ steps.build.outputs.digest }}'
            docker pull "$ref"
          else
            ref='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          fi
          cid=$(docker run -d --rm -p 127.0.0.1:8080:8080 \
            -e PG_MODE=local -e PG_AUTH_MODE=none -e PG_LOCAL_SESSIONURL=http://127.0.0.1:7000 "$ref")
          trap 'docker logs "$cid" | tail -n 40; docker stop "$cid" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200 ]; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200
          parts=$(curl -s http://127.0.0.1:8080/api/v1/curriculum | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["parts"]))')
          echo "curriculum parts: $parts"
          test "$parts" = 15
          curl -s http://127.0.0.1:8080/ | grep -qi '<html'
