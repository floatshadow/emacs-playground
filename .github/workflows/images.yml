# Builds the three images and publishes them to ghcr.io/<owner>/<repo>/:
#   gateway     web app, gateway, curriculum bundle, fonts
#   session     Emacs, toolchains, the course configuration, sessiond
#   remote-box  SSH target for the remote-editing lessons and projects
# Tags: <short sha> and latest on pushes to main, vX.Y.Z on release tags.
# Pull requests build without pushing (the gateway is also smoke-tested).
# No provenance or SBOM attestations, so each tag is one plain image
# manifest. The BuildKit cache of the two large images lives in a separate
# package (…/buildcache:session, …/buildcache:remote-box); the gateway's in
# the GitHub Actions cache.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "design/**", ".github/workflows/ci.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "design/**", ".github/workflows/ci.yml"]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Ignore the build cache (full rebuild)
        type: boolean
        default: false

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            cache-from: type=gha,scope=gateway
            cache-to: type=gha,scope=gateway,mode=max
          - image: session
            cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:session
            cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:session,mode=max
          - image: remote-box
            # The remote box shares the session's Emacs and package stages.
            cache-from: |
              type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:remote-box
              type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:session
            cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:remote-box,mode=max
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' && matrix.image == 'gateway' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ (env.PUSH == 'true' || matrix.image == 'gateway') && matrix.cache-to || '' }}
          no-cache: ${{ inputs.no_cache == true }}
          provenance: false
          sbom: false

      - name: Smoke test
        if: env.PUSH == 'true' || matrix.image == 'gateway'
        run: |
          if [ "$PUSH" = true ]; then
            ref="$IMAGE@${{ steps.build.outputs.digest }}"
            docker pull -q "$ref"
          else
            ref='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          fi
          images/${{ matrix.image }}/test/ci-smoke.sh "$ref"
