# Publishes every image for a release tag (vX.Y.Z): the Emacs development
# image and remote box, and the web services image. Each gets the tags
# X.Y.Z, X.Y and latest. Push the tag and watch this workflow:
#   git tag -a v0.1.0 -m "0.1.0" && git push origin v0.1.0
name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  emacs:
    uses: ./.github/workflows/image-emacs.yml
    with:
      push: true
    secrets: inherit
  web:
    uses: ./.github/workflows/image-web.yml
    with:
      push: true
    secrets: inherit
