id: 00-orientation/03-asking-emacs
title: Asking Emacs
minutes: 12
mode: terminal
modules: [base, agent]
vscode: "hover help, command palette"
setup:
  workspace: fixtures/hello
  root: hello
  reset: true
  open: [hello/src/main.rs]
  layout: single
steps:
  - id: key
    goal: What does C-x C-s run?
    detail: "`C-h k` asks which key you mean. Press `C-x C-s`. A *Help* window names the command and shows its documentation."
    demo: "C-h k ~600 C-x C-s"
    conditions:
      - text: C-h k was used
        any:
          - event: { command: describe-key }
          - event: { command: helpful-key }
        hint: "C-h k (Control h, then k). The echo area asks for a key; press C-x C-s."
      - text: the help explains save-buffer
        elisp: '(let ((b (get-buffer "*Help*"))) (and b (with-current-buffer b (save-excursion (goto-char (point-min)) (search-forward "save-buffer" nil t)))))'
        hint: "The key to describe is C-x C-s. If the help shows another command, try C-h k again."
  - id: source
    goal: Follow the link to its source
    detail: "The cursor is already in the *Help* window. There, `s` opens the Lisp source of the command you are reading about. (`TAB` to the underlined file name and `RET` does the same.)"
    demo: "s"
    conditions:
      - text: the source was opened from the help
        any:
          - event: { command: help-view-source }
          - event: { command: push-button }
          - event: { command: help-follow }
        hint: "Press s while the cursor is in the *Help* window. If it is not, C-x o moves it there."
      - text: files.el is in the selected window
        state: { file: { regex: "/files\\.el(\\.gz)?$" } }
        hint: "save-buffer is written in Lisp in a file called files.el. s in the help window opens it."
      - text: the cursor is on the definition of save-buffer
        elisp: '(with-current-buffer (window-buffer (selected-window)) (save-excursion (beginning-of-line) (looking-at "(defun save-buffer")))'
        hint: "The cursor lands on (defun save-buffer. This is the real code Emacs runs when you press C-x C-s."
  - id: function
    goal: Describe a command by name
    detail: "`C-h f` asks for a function name, with `TAB` completion. Describe `find-file`."
    demo: 'C-h f ~600 "find-file" ~300 RET'
    conditions:
      - text: C-h f was used
        any:
          - event: { command: describe-function }
          - event: { command: helpful-callable }
        hint: "C-h f, type find-file, RET."
      - text: the help describes find-file
        elisp: '(let ((b (get-buffer "*Help*"))) (and b (with-current-buffer b (save-excursion (goto-char (point-min)) (looking-at "find-file is")))))'
        hint: "Type the exact name find-file. TAB completes, RET accepts."
  - id: variable
    goal: Read a variable
    detail: "Settings are variables. `C-h v fill-column RET` shows the value and what it controls."
    demo: 'C-h v ~600 "fill-column" ~300 RET'
    conditions:
      - text: C-h v was used
        any:
          - event: { command: describe-variable }
          - event: { command: helpful-variable }
        hint: "C-h v, type fill-column, RET."
      - text: the help shows fill-column
        elisp: '(let ((b (get-buffer "*Help*"))) (and b (with-current-buffer b (save-excursion (goto-char (point-min)) (looking-at "fill-column")))))'
        hint: "Describe fill-column exactly; TAB helps with the spelling."
  - id: mode
    goal: Which modes are on here?
    detail: "`C-h m` describes the major mode of the current buffer and every minor mode that is switched on, with their keys."
    demo: "C-h m"
    conditions:
      - text: C-h m was used
        event: { command: describe-mode }
        hint: "C-h m, in any window."
      - text: the help lists the modes
        elisp: '(let ((b (get-buffer "*Help*"))) (and b (with-current-buffer b (save-excursion (goto-char (point-min)) (search-forward "minor mode" nil t)))))'
        hint: "The *Help* buffer starts with the major mode and then lists the minor modes."
  - id: menu
    goal: The help menu
    detail: "`C-h ?` shows every help command in one menu. Press `b` in it to list all the key bindings available right now."
    demo: "C-h ? ~1500 b"
    conditions:
      - text: the help menu was opened
        event: { command: help-for-help }
        hint: "C-h, then ? (a question mark)."
      - text: b listed the bindings
        elisp: '(let ((b (get-buffer "*Help*"))) (and b (with-current-buffer b (save-excursion (goto-char (point-min)) (search-forward "Global Bindings" nil t)))))'
        hint: "In the help menu, press b. C-h b does the same directly."
