id: 02-buffers-and-files/04-switch-save-kill
title: Switching, saving and killing buffers
minutes: 12
mode: terminal
modules: [base, agent, editing, files]
vscode: "Ctrl+Tab, Ctrl+S, Ctrl+W, Save As"
setup:
  workspace: fixtures/projects
  root: projects
  reset: true
  open: [projects/hello/README.md]
  layout: single
  # This lesson is about saving: the playground's automatic saving of
  # visited files would clear the ** flag behind the learner's back.
  eval: >-
    (progn
      (when (bound-and-true-p auto-save-visited-mode) (auto-save-visited-mode -1))
      (dolist (b (buffer-list))
        (let ((f (buffer-file-name b)))
          (when (and f (not (buffer-modified-p b)) (not (string-prefix-p "/work/projects/" f)))
            (kill-buffer b))))
      (dolist (f '("/work/projects/hello/CHANGES.md"))
        (let ((b (find-buffer-visiting f))) (when b (kill-buffer b)))
        ;; Written by C-x C-w in an earlier attempt: the fixtures do not
        ;; contain it, so remove it or C-x C-w would ask to overwrite.
        (when (file-exists-p f) (delete-file f))))
steps:
  # Demos type absolute paths right after the directory the prompt offers:
  # the second / starts a fresh path, so they work from whatever buffer the
  # learner is in (Watch it, Skip, Go to this step).
  - id: open
    goal: Open hello's main.rs and lib.rs
    detail: "This lesson works in `/work/projects`, where *hello* is `/work/projects/hello/`. (`/work/hello` is the copy of hello from lesson 2.3; leave it alone here.) Its README.md is open, so `C-x C-f` offers `/work/projects/hello/`: type `src/main.rs`, `RET`. Then `C-x C-f` again: the prompt now starts in `src/`, so `lib.rs` is enough. From any other buffer, type the whole path right after what the prompt offers, `/work/projects/hello/src/main.rs`: a `/` after the offered directory starts over from the root."
    demo: 'C-x C-f ~400 "/work/projects/hello/src/main.rs" RET ~400 C-x C-f ~400 "/work/projects/hello/src/lib.rs" RET'
    conditions:
      - text: hello's main.rs is open
        elisp: '(find-buffer-visiting "/work/projects/hello/src/main.rs")'
        hint: "The file is /work/projects/hello/src/main.rs. Not /work/hello/src/main.rs: that is lesson 2.3's copy, which this step does not look at."
      - text: hello's lib.rs is open
        elisp: '(find-buffer-visiting "/work/projects/hello/src/lib.rs")'
        hint: "Next to main.rs: /work/projects/hello/src/lib.rs. After opening main.rs the prompt already offers /work/projects/hello/src/, so lib.rs RET is enough."
  - id: open-polyglot
    goal: Open polyglot's main.rs and README.md
    detail: "A second project: open `/work/projects/polyglot/src/main.rs`, typed right after the directory the prompt offers. Then its `README.md`: from the prompt in `src/`, `../README.md` goes one folder up. Watch the buffer names: the two files called *main.rs* become `main.rs<hello>` and `main.rs<polyglot>`, and the two READMEs `README.md<hello>` and `README.md<polyglot>`."
    demo: 'C-x C-f ~400 "/work/projects/polyglot/src/main.rs" RET ~400 C-x C-f ~400 "/work/projects/polyglot/README.md" RET'
    conditions:
      - text: polyglot's main.rs and README.md are open
        elisp: '(and (find-buffer-visiting "/work/projects/polyglot/src/main.rs") (find-buffer-visiting "/work/projects/polyglot/README.md"))'
        hint: "In the C-x C-f prompt, type /work/projects/polyglot/src/main.rs right after what is there; the second / starts a fresh path. Then ../README.md from there."
      - text: hello's main.rs and lib.rs are still open
        elisp: '(and (find-buffer-visiting "/work/projects/hello/src/main.rs") (find-buffer-visiting "/work/projects/hello/src/lib.rs"))'
        hint: "The previous step opened them. If one was closed, open it again: /work/projects/hello/src/main.rs and lib.rs next to it."
      # Files of lesson 2.3's copy (/work/hello) change the names the later
      # steps type: main.rs<projects/hello>, lib.rs<projects>. The setup
      # closes them; this catches the ones opened by mistake in step 1.
      - text: nothing from /work/hello (lesson 2.3's copy) is open
        elisp: '(not (seq-find (lambda (b) (string-prefix-p "/work/hello/" (or (buffer-file-name b) ""))) (buffer-list)))'
        hint: "A file under /work/hello is open, lesson 2.3's copy of hello, and its buffer names get mixed up with this lesson's. Close each one: C-x C-f /work/hello/src/main.rs RET shows it, C-x k RET kills it."
      - text: the two main.rs are main.rs<hello> and main.rs<polyglot>
        elisp: '(let ((a (find-buffer-visiting "/work/projects/hello/src/main.rs")) (b (find-buffer-visiting "/work/projects/polyglot/src/main.rs"))) (and a b (equal (buffer-name a) "main.rs<hello>") (equal (buffer-name b) "main.rs<polyglot>")))'
        hint: "Emacs adds the folder in angle brackets when two buffers would have the same name, and only as much of the path as it needs: main.rs<hello> and main.rs<polyglot>."
  - id: switch
    goal: Switch to main.rs<hello>, back, and back again
    detail: "`C-x b` switches by name: type `main.rs<h`, `TAB`, `RET`. `C-x b RET` with nothing typed goes back to the buffer you were just in. `C-x <left>` walks back through what this window showed before, `C-x <right>` forward."
    demo: 'C-x b ~400 "main.rs<h" ~300 TAB ~300 RET ~600 C-x b ~400 RET ~600 C-x <left>'
    conditions:
      - text: C-x b was used twice
        any:
          - event: { command: switch-to-buffer, min: 2 }
          - event: { command: consult-buffer, min: 2 }
        hint: "C-x b, type main.rs<h, TAB, RET. Then C-x b and just RET to go back."
      - text: C-x <left> or C-x <right> was used
        any:
          - event: { command: previous-buffer }
          - event: { command: next-buffer }
        hint: "Control x, then the left arrow key: the previous buffer shown in this window."
      - text: main.rs<hello> is shown
        state: { file: /work/projects/hello/src/main.rs }
        hint: "End on hello's main.rs. C-x b main.rs<hello> RET gets you there directly."
  - id: save-all
    goal: Change main.rs and lib.rs, then save both at once
    detail: "Add a comment at the top of each file (`M-<`, then type). Both mode lines show `**`. `C-x s` offers to save every modified buffer, one by one: `y` saves, `n` skips, `!` saves all the rest."
    demo: 'M-< ~300 "// edited in Emacs\n" ~300 C-x b ~400 "lib.rs" RET ~300 M-< ~300 "// edited too\n" ~400 C-x s ~600 !'
    conditions:
      - text: main.rs and lib.rs both start with a comment
        elisp: '(seq-every-p (lambda (f) (let ((b (find-buffer-visiting f))) (and b (with-current-buffer b (save-excursion (goto-char (point-min)) (looking-at "//")))))) (list "/work/projects/hello/src/main.rs" "/work/projects/hello/src/lib.rs"))'
        hint: "Type a line starting with // at the very top of main.rs<hello> and of lib.rs. The demo writes // edited in Emacs."
      - text: C-x s saved them
        event: { command: save-some-buffers }
        hint: "Control x, then a plain s. Answer ! to save every modified buffer."
      - text: nothing is left unsaved
        elisp: '(not (seq-find (lambda (b) (and (buffer-file-name b) (string-prefix-p "/work/projects/" (buffer-file-name b)) (buffer-modified-p b))) (buffer-list)))'
        hint: "A ** in a mode line means unsaved. C-x s again and answer y or !."
  - id: save-as
    goal: Save hello's README.md as CHANGES.md
    detail: "`C-x C-w` writes the buffer to a new file and the buffer follows it: switch to `README.md<hello>`, press `C-x C-w`, type `CHANGES.md`, `RET`. README.md stays on disk as it was."
    demo: 'C-x b ~400 "README.md<h" ~300 TAB ~300 RET ~400 C-x C-w ~400 "CHANGES.md" RET'
    conditions:
      - text: C-x C-w was used
        event: { command: write-file }
        hint: "Control x, then Control w. Browsers like to grab Ctrl+W: use Focus mode, or M-x write-file."
      - text: CHANGES.md exists in hello
        file: { path: projects/hello/CHANGES.md, exists: true }
        hint: "Write it next to README.md: the prompt starts in /work/projects/hello/, so CHANGES.md is enough."
      - text: the buffer now visits CHANGES.md
        state: { file: /work/projects/hello/CHANGES.md }
        hint: "Look at the mode line: after C-x C-w the buffer is called CHANGES.md. If it still says README.md<hello>, C-x C-w ran in another buffer; switch to README.md<hello> and write again."
  - id: kill-two
    goal: Kill CHANGES.md and polyglot's main.rs
    detail: "`C-x k RET` kills the current buffer. Then `C-x k`, `main.rs<p`, `TAB`, `RET` kills the other. Watch hello's buffer lose its `<hello>`: there is only one *main.rs* left."
    demo: 'C-x k ~400 RET ~600 C-x k ~400 "main.rs<p" ~300 TAB ~300 RET'
    conditions:
      - text: two buffers were killed
        any:
          - event: { command: kill-buffer, min: 2 }
          - event: { command: kill-current-buffer, min: 2 }
        hint: "C-x k offers the current buffer; RET accepts. For the second one, type its name."
      - text: neither CHANGES.md nor polyglot's main.rs is open
        elisp: '(not (or (find-buffer-visiting "/work/projects/hello/CHANGES.md") (find-buffer-visiting "/work/projects/polyglot/src/main.rs")))'
        hint: "Kill the buffer CHANGES.md and the buffer main.rs<polyglot>."
      - text: hello's main.rs is plain main.rs again
        elisp: '(let ((b (find-buffer-visiting "/work/projects/hello/src/main.rs"))) (and b (equal (buffer-name b) "main.rs")))'
        hint: "Once only one main.rs is open, the <hello> suffix goes away by itself."
  - id: revert
    goal: Throw away an unsaved change
    detail: "In `lib.rs`, type something you regret. `C-x x g` reverts the buffer to the file on disk; it asks first because there are unsaved changes."
    demo: 'C-x b ~400 "lib.rs" RET ~300 M-> ~300 "oops" ~600 C-x x g ~600 y'
    conditions:
      - text: the buffer was reverted
        any:
          - event: { command: revert-buffer-quick }
          - event: { command: revert-buffer }
        hint: "C-x x g, then y. (M-x revert-buffer does the same.)"
      - text: lib.rs matches the file again
        elisp: '(let ((b (find-buffer-visiting "/work/projects/hello/src/lib.rs"))) (and b (not (buffer-modified-p b)) (with-current-buffer b (save-excursion (goto-char (point-min)) (not (search-forward "oops" nil t))))))'
        hint: "Revert lib.rs, not another buffer: switch to it first with C-x b lib.rs RET."
      - text: the saved comment survived
        file: { path: projects/hello/src/lib.rs, regex: "\\A//" }
        hint: "Reverting reloads what was saved, so the comment from the save step is still there. If it is gone, it was never saved: reset this step."
