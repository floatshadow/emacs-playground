id: 13-making-it-yours/07-key-menus
title: Key menus with transient
minutes: 15
mode: terminal
modules: [base, agent, editing, files, windows, completion, git, terminals, lsp, lang-rust, lang-ocaml, lang-python, writing, input, org, power, remote, ui]
vscode: "Command Palette categories, Ctrl+K chords"
setup:
  workspace: fixtures/mine
  root: mine
  reset: true
  open: [mine/journal/notes.md]
  layout: single
  run: sh seed.sh my-keys.el my-menus.el
  # my-map (lesson 13.3) and the menus: a file seeded just now is not in
  # the user-lisp autoloads yet, so its cookie has not loaded it. The
  # menus live in memory, outside checkpoints, so every restore (Reset
  # this step, Do it yourself, Go to this step) evaluates the restored
  # file again, after taking away the keys bound to the menu: the menu
  # and its key are then those of the file. The source is loaded even
  # when a .elc from an Emacs start is older than the restored file.
  eval: >-
    (progn
      (ignore-errors (require 'my-keys) (let ((load-prefer-newer t)) (load "my-menus" nil t)))
      (add-hook 'playground-reset-step-hook
                (lambda ()
                  (dolist (key (where-is-internal 'my-menu (list global-map)))
                    (define-key global-map key nil t))
                  (ignore-errors (let ((load-prefer-newer t)) (load "my-menus" nil t))))))
# The edit steps check the saved file (the transient-define-prefix form,
# read, suffixes found by command, so the learner's own keys, titles and
# layout pass) and what the keys pressed since the step began did; the
# exit step also asks the evaluated menu (transient-get-suffix). `waiting`
# is null once no menu is open; "you closed the menu" also needs the
# step's suffix pressed, so it is not met before the menu opened.
steps:
  - id: open
    goal: Open the menu, split, move twice, close it
    detail: "`M-x my-menu RET`: the menu appears at the bottom. Press `3` (split right), then `o` and `o` again, then `q`."
    demo: 'M-x ~400 "my-menu" ~300 RET ~1200 3 ~800 o ~600 o ~600 q ~800'
    conditions:
      - text: the menu opened
        event: { command: my-menu }
        hint: "The completion list narrows to my-menu as you type; RET on it. The menu's window lists Windows, Buffers, Toggles and Misc."
      - text: there are two windows
        state: { "windows.length": { gte: 2 } }
        hint: "3 in the menu splits like C-x 3, and the menu stays open: 3 says :transient t. If the menu is gone, open it again."
      - text: o ran twice without reopening the menu
        event: { command: other-window, min: 2 }
        hint: "The cursor jumps between the windows and the menu stays on screen; there is no need to open it again between the two."
      - text: you closed the menu
        all:
          - event: { command: my-menu }
          - state: { waiting: null }
        hint: "The menu's last line says it: q closes it. C-g closes any transient menu too."
    stuck:
      - when: { unbound_repeats: 2 }
        say: "A key that does nothing? C-c u m is not bound until the next step. For now M-x my-menu RET opens the menu."
      - when: { idle_seconds: 45 }
        say: "While the menu is open, the keys it lists at the bottom stay active: 3 splits, o moves, q closes it."
  - id: bind
    goal: Put the menu on C-c u m
    detail: "`C-x C-f /work/emacs.d/user-lisp/my-menus.el RET`. Under `;; My key for the menu:` add `(keymap-set my-map \"m\" '(\"my menu\" . my-menu))`, `C-x C-s`, `M-x eval-buffer`. Then `C-c u m`, and `q`."
    demo: 'C-x C-f ~500 "/work/emacs.d/user-lisp/my-menus.el" ~400 RET ~1000 M-< ~300 C-s ~300 ";; My key for the menu:" ~300 RET C-n C-a C-SPC C-e ~300 "(keymap-set my-map \"m\" ''(\"my menu\" . my-menu))" ~500 C-x C-s ~600 M-x ~400 "eval-buffer" ~300 RET ~1000 C-c u m ~1500 q ~800'
    conditions:
      - text: my-menus.el binds the menu
        file: { path: emacs.d/user-lisp/my-menus.el, regex: "\\(keymap-(global-)?set\\s.*my-menu\\b" }
        hint: "The line has the shape of the window-sizes line above it: my-map, the key \"m\", then the label and the command in '( . )."
      - text: a key opens it in this Emacs
        elisp: "(where-is-internal 'my-menu nil t)"
        hint: "Saving does not run Lisp: M-x eval-buffer runs the file, or C-M-x with the cursor in the line runs that line."
      - text: you opened the menu with your key
        event: { command: my-menu }
        hint: "Press C-c u and wait: which-key lists m as my menu, next to s for window sizes."
      - text: you closed the menu
        all:
          - event: { command: my-menu }
          - state: { waiting: null }
        hint: "The menu's last line says how: q closes it, and C-g closes any transient menu."
    stuck:
      - when: { unbound_repeats: 2 }
        say: "C-c u m is still unbound in this Emacs. Saving does not apply the new line: M-x eval-buffer in my-menus.el does."
  - id: toggles
    goal: Move line numbers into the Toggles group
    detail: "In my-menus.el (`C-x C-f /work/emacs.d/user-lisp/my-menus.el RET`), on the `\"l\"` line under Misc, `C-a C-k C-k` cuts the whole line. On the `\"v\"` line under Toggles, `C-a C-y` pastes it above. `C-x C-s`, `M-x eval-buffer`. Then `C-c u m`: line numbers now sit under Toggles. Press `l`, then `q`."
    demo: 'C-x C-f ~500 "/work/emacs.d/user-lisp/my-menus.el" ~400 RET ~1000 M-< ~300 C-s ~300 "display-line-numbers-mode" ~300 RET ~300 C-a C-k C-k ~500 M-< ~300 C-s ~300 "visual-line-mode" ~300 RET ~300 C-a C-y ~500 C-x C-s ~600 M-x ~400 "eval-buffer" ~300 RET ~1000 C-c u m ~1200 b ~800 "notes.md" ~400 RET ~1000 C-c u m ~1200 l ~1000 q ~800'
    conditions:
      - text: in the saved file, line numbers share a group with whitespace
        elisp: >-
          (ignore-errors
            (let ((has (lambda (v cmd) (seq-some (lambda (s) (and (consp s) (memq cmd s))) v)))
                  (todo (list (with-temp-buffer
                                (insert-file-contents "/work/emacs.d/user-lisp/my-menus.el")
                                (re-search-forward "^(transient-define-prefix my-menu\\_>")
                                (goto-char (match-beginning 0))
                                (read (current-buffer)))))
                  (found nil))
              (while (and todo (not found))
                (let ((x (pop todo)))
                  (when (and (vectorp x) (funcall has x (quote whitespace-mode)) (funcall has x (quote display-line-numbers-mode)))
                    (setq found t))
                  (when (or (vectorp x) (consp x))
                    (setq todo (append (seq-filter (lambda (y) (or (vectorp y) (consp y))) (append x nil)) todo)))))
              found))
        hint: "The second C-k takes the line break, so the whole suffix moves. Paste it between Toggles' two suffixes, before the ] that closes the group, and save."
      - text: you switched line numbers from the menu
        event: { command: display-line-numbers-mode }
        hint: "Evaluate the file after saving it (M-x eval-buffer); the next C-c u m shows l under Toggles. l switches line numbers in the buffer you are in, either way is fine."
      - text: you closed the menu
        all:
          - event: { command: display-line-numbers-mode }
          - state: { waiting: null }
        hint: "Toggles say :transient t: the menu stays after l until you press q."
    stuck:
      - when: { quits_in_window: { count: 3, seconds: 15 } }
        say: "C-g closes menus and prompts, but it does not undo. C-/ does, one change at a time: press it until the cut line is back."
  - id: mine
    goal: Rename Misc to Mine and duplicate a line twice
    detail: "In my-menus.el change the group title `\"Misc\"` to `\"Mine\"` (or a name you like), `C-x C-s`, `M-x eval-buffer`. Go to notes.md (`b` in the menu switches buffers), then `C-c u m`, `d`, `d`, `q`."
    demo: 'C-x C-f ~500 "/work/emacs.d/user-lisp/my-menus.el" ~400 RET ~1000 M-< ~300 C-s ~300 "\"d\" \"duplicate" ~300 RET ~300 C-p C-e C-b ~300 M-DEL ~300 "Mine" ~500 C-x C-s ~600 M-x ~400 "eval-buffer" ~300 RET ~1000 C-c u m ~1200 b ~800 "notes.md" ~400 RET ~800 M-< ~300 C-c u m ~1200 d ~600 d ~1000 q ~800'
    conditions:
      - text: the saved file has no Misc group, and d is still in it
        all:
          - file: { path: emacs.d/user-lisp/my-menus.el, not_contains: "\"Misc\"" }
          - file: { path: emacs.d/user-lisp/my-menus.el, contains: "duplicate-line" }
        hint: "The title is the string right after the [ that opens the group; keep its quotes and change only the word."
      - text: d duplicated twice
        event: { command: duplicate-line, min: 2 }
        hint: "Keys with :transient t repeat with the menu still on screen, like the repeat map of lesson 13.3: d, then d again, without reopening it."
      - text: you closed the menu
        all:
          - event: { command: duplicate-line }
          - state: { waiting: null }
        hint: "The menu stays after d because d says :transient t; q closes it."
  - id: exit
    goal: Let f close the menu and open draft.md with it
    detail: "In my-menus.el delete ` :transient t` from the `f` suffix, `C-x C-s`, `M-x eval-buffer`. Then `C-c u m f /work/mine/journal/draft.md RET`: the menu closes on its own."
    demo: 'C-x C-f ~500 "/work/emacs.d/user-lisp/my-menus.el" ~400 RET ~1000 M-< ~300 C-s ~300 "\"open a file\" find-file" ~300 RET ~300 C-k ")" ~500 C-x C-s ~600 M-x ~400 "eval-buffer" ~300 RET ~1000 C-c u m ~1200 f ~800 "/work/mine/journal/draft.md" ~400 RET ~1500'
    conditions:
      - text: the saved f suffix closes the menu
        file: { path: emacs.d/user-lisp/my-menus.el, regex: "\\(\"f\"[^)\\n]*find-file(\\s+:transient\\s+nil)?\\s*\\)" }
        hint: "Delete only :transient t and the space before it; the ) that closes the suffix stays."
      - text: the menu you evaluated closes after f
        elisp: "(ignore-errors (let ((s (transient-get-suffix 'my-menu \"f\"))) (and s (not (plist-get (cdr s) :transient)))))"
        hint: "Evaluate the file after saving it: until then the menu in memory still keeps f open."
      - text: draft.md is open
        state: { file: /work/mine/journal/draft.md }
        hint: "f asks for a file: type /work/mine/journal/draft.md right after the directory it offers; the second / starts over from the root."
      - text: the menu closed by itself
        all:
          - event: { command: find-file }
          - state: { waiting: null }
        hint: "If the menu came back after the file opened, f still keeps it open: q closes it, then check the f line and evaluate again."
    stuck:
      - when: { minibuffer_seconds: 40 }
        say: "The prompt wants the file: type /work/mine/journal/draft.md after the directory it shows and press RET. C-g cancels it."
  - id: sizes
    goal: Widen a window with the size menu, then leave it
    detail: "`C-x 3`, then `C-c u s`: the size menu. `<right>` twice widens this window. Type a word: it goes into the buffer, and the menu stays. `q` closes it."
    demo: 'C-x 3 ~600 C-c u s ~1200 <right> ~500 <right> ~500 <left> ~500 "ok" ~800 q ~800'
    conditions:
      - text: you widened a window twice
        event: { command: enlarge-window-horizontally, min: 2 }
        hint: "The arrow keys belong to the size menu while it is open. A single window has nothing to grow into: C-x 3 first."
      - text: you closed the size menu
        all:
          - event: { command: enlarge-window-horizontally }
          - state: { waiting: null }
        hint: "Keys it does not list go through, so the menu is easy to forget: its Window size window is still at the bottom. q closes it, and C-g always does."
    stuck:
      - when: { idle_seconds: 30 }
        say: "Is the Window size menu still at the bottom? Then the arrows resize instead of moving the cursor. q closes it."
      - when: { quits_in_window: { count: 3, seconds: 10 } }
        say: "One C-g closes the menu; after that, C-g only cancels."
