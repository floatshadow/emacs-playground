id: 05-git-with-magit/02-commits-log-blame
title: "Commits, log and blame"
minutes: 15
mode: terminal
modules: [base, agent, editing, files, windows, completion, git]
vscode: GitLens
setup:
  workspace: fixtures/ledger
  root: ledger
  reset: true
  # Five commits by four authors; the last message says "teh".
  run: 'sh -c "$(cat .lesson/history.sh)"'
  open: [ledger/src/lib.rs]
  layout: single
  # Magit and timemachine buffers from an earlier visit go, and so does
  # Magit's memory of which sections were open. The setup re-created .git under
  # file buffers that may be open: refresh their version control state
  # (diff-hl, smerge).
  eval: >-
    (progn
      (dolist (b (buffer-list))
        (with-current-buffer b
          (cond ((or (derived-mode-p 'magit-mode) (bound-and-true-p git-timemachine-mode))
                 (let ((kill-buffer-query-functions nil)) (kill-buffer b)))
                ((and buffer-file-name (string-prefix-p "/work/ledger/" buffer-file-name))
                 (vc-file-clearprops buffer-file-name)
                 (vc-refresh-state)
                 (when (bound-and-true-p diff-hl-mode) (diff-hl-update))))))
      (when (boundp 'magit-repository-local-cache)
        (setq magit-repository-local-cache nil)))
steps:
  - id: log
    goal: Show the history of the current branch
    detail: "`C-x g` opens the status; there `l` opens the log menu and `l` again shows the log of the current branch: one line per commit, newest first, with author and age."
    demo: "C-x g ~1000 l ~1000 l ~1500"
    conditions:
      - text: l l was used
        event: { command: magit-log-current }
        hint: "Two separate presses of l, in the status buffer. The first opens a menu at the bottom; the second picks Log current."
      - text: the log is shown
        state: { mode: magit-log-mode }
        hint: "The log replaces the status in this window. If it went away, C-x g then l l again."
  - id: show
    goal: Open the commit that added totals per category
    detail: "Move to the line *Add totals per category* and press `RET`. The commit opens beside the log: its author, date, message and diff."
    demo: 'C-x g ~800 l ~800 l ~1500 M-< ~300 C-s ~300 "Add totals" ~300 RET ~500 RET ~1500'
    conditions:
      - text: RET opened a commit
        any:
          - event: { command: magit-visit-thing }
          - event: { command: magit-show-commit }
          - event: { command: magit-diff-show-or-scroll-up }
        hint: "RET in the log, on a commit's line. SPC also shows the commit, without moving the cursor."
      - text: that commit is shown
        elisp: '(seq-find (lambda (w) (with-current-buffer (window-buffer w) (and (derived-mode-p (quote magit-revision-mode)) (equal (magit-rev-format "%s" magit-buffer-revision) "Add totals per category")))) (window-list))'
        hint: "RET shows the commit on the cursor's line. n and p move between commits; each line shows the short hash, then the summary, then the author and the age."
  - id: blame
    goal: Find who last changed the CURRENCY line, and open that commit
    detail: "Who set the currency to euros, and when? Open `/work/ledger/src/lib.rs`, put the cursor on the line `pub const CURRENCY`, and press `C-c f b`. Each block of lines gets a heading: the commit that last changed it, with author and date. Then `RET` on the line opens that commit in full."
    # Killing lib.rs first drops a blame already on, which a second
    # C-c f b would take one level further back.
    demo: 'C-x 1 ~400 C-x b ~400 "lib.rs" ~400 RET ~400 C-x k ~400 RET ~600 C-x C-f ~600 "/work/ledger/src/lib.rs" ~400 RET ~800 M-< ~300 C-s ~300 "CURRENCY:" ~300 RET ~500 C-c f ~1000 b ~2500 RET ~1500'
    conditions:
      - text: C-c f b was used
        event: { command: magit-blame-addition }
        hint: "C-c f is Magit's menu for the current file; b in it is Blame. Run it once, in lib.rs: if the line now says USD, you blamed twice and went back in time; q climbs out one level."
      - text: the commit that last changed the line is shown
        elisp: '(seq-find (lambda (w) (with-current-buffer (window-buffer w) (and (derived-mode-p (quote magit-revision-mode)) (equal (magit-rev-format "%s" magit-buffer-revision) "Switch the currency to euros")))) (window-list))'
        hint: "RET opens the commit of the line the cursor is on, while blame is on (the buffer is read-only then; q ends blame). The heading above the CURRENCY line names Lin Chen, 17 March 2026."
  - id: amend
    goal: "Fix the typo in the last commit's message"
    detail: "The latest commit says *teh*. In the status (`C-x g`), `c a` amends the last commit: its message opens for editing. Change *teh* to *the* and press `C-c C-c`."
    demo: 'C-x 1 ~400 C-x g ~1000 c ~1000 a ~2000 M-< ~300 C-s ~300 "teh" ~300 RET ~300 DEL ~200 DEL ~200 DEL ~300 "the" ~800 C-c C-c ~2000'
    conditions:
      - text: C-c C-c finished the amend
        event: { command: with-editor-finish }
        hint: "c then a, in the status buffer. Edit the first line of COMMIT_EDITMSG, then Control c twice."
      - text: the last commit says the, and there are still five commits
        shell: { run: "test \"$(git log -1 --format=%s)\" = 'Explain rounding in the README' && test $(git rev-list --count HEAD) -eq 5" }
        hint: "Amend replaces the last commit instead of adding one. If you made a new commit with c c, Reset this step and use c a."
