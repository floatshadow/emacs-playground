  <line x1="40" y1="170" x2="40" y2="20" stroke="#333333" stroke-width="2"/>
  <rect x="70" y="150" width="50" height="20" fill="#7a58c4"/>
  <rect x="145" y="110" width="50" height="60" fill="#7a58c4"/>
