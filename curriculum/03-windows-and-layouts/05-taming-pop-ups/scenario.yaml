id: 03-windows-and-layouts/05-taming-pop-ups
title: Taming pop-ups
minutes: 15
mode: terminal
modules: [base, agent, editing, files, windows]
vscode: "the panel, sidebar behaviour, preview editors"
setup:
  workspace: fixtures/projects
  root: projects
  reset: true
  open: [projects/hello/src/main.rs]
  layout: "projects/hello/src/main.rs"
  # Start without the rule this lesson adds, so it can be added again.
  eval: >-
    (progn
      (dolist (b (buffer-list))
        (let ((f (buffer-file-name b)))
          (when (and f (not (buffer-modified-p b)) (not (string-prefix-p "/work/projects/" f)))
            (kill-buffer b))))
      (setq display-buffer-alist
            (seq-remove (lambda (r) (equal (car-safe r) "\\*Help\\*")) display-buffer-alist))
      (dolist (n '("*Help*" "*compilation*"))
        (when (get-buffer n) (kill-buffer n))))
steps:
  - id: build
    goal: Run the build and see where its output lands
    detail: "`C-x p c`, clear the offered command (`C-a C-k`), type `sh build.sh`, `RET`. The output opens at the bottom, a third of the frame high, because a rule in the windows module says so."
    demo: 'C-x p c ~600 C-a ~200 C-k ~300 "sh build.sh" RET ~1500'
    conditions:
      - text: the build ran
        any:
          - event: { command: project-compile }
          - event: { command: compile }
        hint: "Control x, p, c. Replace make -k with sh build.sh."
      - text: main.rs above, compile output below
        layout: "(vsplit main.rs *compilation*)"
        hint: "The output appears below main.rs by itself. If other windows are open, C-x 1 first, then build again."
      - text: the output window is about a third of the frame
        elisp: '(let ((w (get-buffer-window "*compilation*"))) (and w (<= (abs (- (window-total-height w) (/ (window-total-height (frame-root-window)) 3))) 2)))'
        hint: "That is the rule at work. If you resized the window, C-x 1 and build again."
  - id: read
    goal: Read the rule with C-h v
    detail: "Rules live in the variable `display-buffer-alist`. `C-h v display-buffer-alist RET` shows its value: find *display-buffer-at-bottom* and *window-height . 0.33*. The help opens wherever Emacs's default puts it, and takes the cursor; `q` closes it."
    demo: 'C-h v ~500 "display-buffer-alist" RET ~1500 q'
    conditions:
      - text: C-h v was used
        any:
          - event: { command: describe-variable }
          - event: { command: helpful-variable }
        hint: "C-h v, type display-buffer-alist (TAB completes), RET."
      - text: the help showed the rule
        elisp: '(let ((b (get-buffer "*Help*"))) (and b (with-current-buffer b (save-excursion (goto-char (point-min)) (search-forward "display-buffer-at-bottom" nil t)))))'
        hint: "Describe the variable display-buffer-alist itself."
      - text: the help is closed again
        state: { "windows.mode": { not: help-mode } }
        hint: "q in the help window closes it."
  - id: rule
    goal: Send *Help* to the right with a rule of your own
    detail: "Open `/work/projects/notes/popups.el`. The rule for *Help* at the end of the file has two wrong values, numbered 1 and 2 in the comments beside them: change `(side . bottom)` to `(side . right)` and `0.25` to `0.4`. Save, then `M-x eval-buffer RET` runs the file, which adds the rule."
    demo: 'C-x C-f ~400 "/work/projects/notes/popups.el" RET ~500 M-< ~300 C-s ~300 "(side . bottom" RET ~300 M-DEL ~300 "right" ~300 C-s ~300 "0.25" RET ~300 DEL DEL DEL DEL ~300 "0.4" ~300 C-x C-s ~400 M-x ~400 "eval-buffer" RET'
    conditions:
      - text: popups.el says right and 0.4
        all:
          - file: { path: projects/notes/popups.el, contains: "(side . right)" }
          - file: { path: projects/notes/popups.el, contains: "(window-width . 0.4)" }
        hint: "The values to change are in the rule near the end of the file, on the line (side . bottom) under the *Help* pattern: bottom becomes right, and 0.25 on the next line becomes 0.4. The first bottom in the file is in a comment at the top; changing it does nothing. Then save with C-x C-s."
      - text: the file was evaluated
        any:
          - event: { command: eval-buffer }
          - event: { command: eval-defun }
          - event: { command: eval-last-sexp }
          - event: { command: elisp-eval-region-or-buffer }
        hint: "M-x eval-buffer RET, in the popups.el buffer. (C-M-x on the rule does the same for one form.)"
      - text: the rule is active
        elisp: '(let ((r (assoc "\\*Help\\*" display-buffer-alist))) (and r (eq (alist-get (quote side) (cddr r)) (quote right))))'
        hint: "Evaluate the file after saving the fix. Evaluating the old version adds the old rule; just fix it and evaluate again."
    stuck:
      - when: { step_seconds: 240 }
        say: "In the rule at the end of popups.el, change (side . bottom) to (side . right) and 0.25 to 0.4; the bottom in the comment at the top does not count. Save with C-x C-s, then M-x eval-buffer RET while popups.el is the current buffer."
  - id: try
    goal: Ask for help again and watch it open on the right
    detail: "`C-h f find-file RET`. This time *Help* appears in a side window along the right edge, two fifths wide, and the build output stays where it was."
    demo: 'C-h f ~500 "find-file" RET'
    conditions:
      - text: C-h f was used
        any:
          - event: { command: describe-function }
          - event: { command: helpful-callable }
        hint: "C-h f asks for a function name; type find-file and RET. Your rule decides where *Help* goes, so watch the right edge of the frame."
      - text: "*Help* is in a side window on the right"
        state: { "windows.side": right, "windows.buf": "*Help*" }
        hint: "If help opened elsewhere, the rule is not active yet: evaluate popups.el again (M-x eval-buffer in it)."
      - text: the layout is main area left, help right
        layout: "(hsplit (vsplit * *compilation*) *Help*)"
        hint: "The build output should still be under the file. If it is gone, run C-x p c again."
  - id: hide
    goal: Hide the side window, keeping the rest
    detail: "`C-x w s` hides every side window at once and shows them again on the next press, like VS Code's panel toggle. The build output is not a side window, so it stays."
    demo: "C-x w s"
    conditions:
      - text: C-x w s was used
        event: { command: window-toggle-side-windows }
        hint: "Control x, w, then s."
      - text: no side window is shown
        state: { "windows.side": { not: { in: [left, right, top, bottom] } } }
        hint: "Press C-x w s once; a second press shows the side window again."
      - text: the file and the build output remain
        layout: "(vsplit * *compilation*)"
        hint: "C-x w s only hides side windows. If the build output went too, C-x p c brings it back."
