id: 12-remote-editing/03-magit-over-tramp
title: Magit over TRAMP and sudo
minutes: 12
mode: terminal
tags: [remote]
modules: [base, agent, editing, files, windows, completion, git, terminals, lsp, lang-rust, lang-ocaml, lang-python, writing, input, org, power, remote]
vscode: remote source control
remote: { box: true }
setup:
  workspace: fixtures/tramp
  root: tramp
  reset: true
  open: [tramp/README.md]
  layout: single
  run: sh setup.sh
  # Box files are reset by setup.sh; buffers still showing an old copy
  # would ask "changed on disk; reread?", so they go, with remote shells
  # (they would satisfy a step at once) and the
  # connections (a re-created box has new host keys).
  eval: >-
    (progn
      (dolist (b (buffer-list))
        (when (buffer-live-p b)
         (with-current-buffer b
          (when (and (string-match-p "\\`/\\(ssh\\|sudo\\):" default-directory)
                     (string-match-p "/\\(app\\|greeter\\|site\\|etc/app\\|srv/sidecar\\)\\(/\\|\\'\\)" default-directory)
                     (or buffer-file-name (derived-mode-p (quote dired-mode) (quote magit-mode) (quote eshell-mode) (quote eat-mode))))
            (set-buffer-modified-p nil)
            (let ((kill-buffer-query-functions nil)) (kill-buffer b))))))
      (when (featurep (quote tramp)) (tramp-cleanup-all-connections)))
steps:
  - id: status
    goal: Open Magit on the box's site repository
    detail: "`C-x C-f /ssh:box:~/site/ RET` opens the folder; `C-x g` there shows Magit for the repository on the box."
    demo: 'C-x C-f ~500 C-a C-k ~300 "/ssh:box:~/site/" ~1500 RET ~2500 C-x g ~4000'
    conditions:
      - text: C-x g opened Magit
        event: { command: magit-status }
        hint: "Press C-x g in the box's site folder, not in README.md: Magit shows the repository of the buffer's folder, and /work/tramp is not the one you want."
      - text: Magit shows the box's site repository
        elisp: '(with-current-buffer (window-buffer (selected-window)) (and (derived-mode-p (quote magit-status-mode)) (string-match-p "\\`/ssh:box:.*site/\\''" default-directory)))'
        hint: "The Magit buffer's header names the repository. If it shows /work/..., open /ssh:box:~/site/ first and press C-x g there."
  - id: commit
    goal: Add a line to index.html, then commit it from Magit
    detail: "`C-x C-f index.html RET`, add a line before `</html>`, `C-x C-s`. Then `C-x g`: `S` stages it, `c c` opens the message, type one line, `C-c C-c` commits, on the box."
    demo: 'C-x C-f ~400 C-a C-k ~300 "/ssh:box:~/site/index.html" ~500 RET ~1500 M-> C-p ~300 "<p>Changed over TRAMP.</p>" RET ~300 C-x C-s ~2000 C-x g ~3000 S ~2000 c c ~4000 "Add a line from Emacs" ~500 C-c C-c ~4000'
    conditions:
      - text: index.html was saved
        event: { command: save-buffer }
        hint: "Remote files are saved only by C-x C-s: Magit sees what is on the box, not unsaved text."
      - text: the commit message was finished
        # Magit's sentinels over TRAMP can swallow the command's event;
        # the box's history shows the commit either way.
        any:
          - event: { command: with-editor-finish }
          - shell: { host: box, run: "cd site && test \"$(git rev-list --count HEAD)\" -ge 2", timeout: 20 }
        hint: "In Magit, S stages every change and c c opens the message buffer. Type a line there, then C-c C-c."
      - text: the box's repository has the new commit, nothing left over
        shell: { host: box, run: "cd site && git diff --quiet HEAD && test \"$(git rev-list --count HEAD)\" -ge 2 && git show --name-only --format= HEAD | grep -qx index.html", timeout: 20 }
        hint: "Magit's status buffer shows what is left: an Unstaged or Staged section means the commit missed something. g refreshes it."
    stuck:
      - when: { step_seconds: 240 }
        say: "In the Magit buffer: S stages everything, c c opens the message. The message buffer is a file on the box too; C-c C-c finishes it, C-c C-k gives up."
  - id: readonly
    goal: Open /etc/app/app.env on the box
    detail: "`C-x C-f`, then type `/etc/app/app.env` after the offered folder: in a remote prompt, a `/` starts from the box's root. It opens read-only: `%%` in the mode line."
    demo: 'C-x C-f ~500 C-a C-k ~300 "/ssh:box:/etc/app/app.env" ~1000 RET ~2000'
    conditions:
      - text: the box's /etc/app/app.env is open as deploy
        state: { file: { regex: "^/ssh:box:/etc/app/app\\.env$" } }
        hint: "From a buffer on the box, C-x C-f offers a folder on the box, and /etc/... after it means /etc on the box. From a local buffer you would type /ssh:box:/etc/app/app.env."
      - text: it is read-only
        state: { readonly: true }
        hint: "root owns the file, so deploy cannot write it: %% in the mode line. That is expected; the next step reopens it as root."
  - id: sudo
    goal: Reopen it as root and set MODE=production
    detail: "`C-x C-f`, `C-a C-k` to empty the prompt, then `/ssh:box|sudo::/etc/app/app.env` and `RET`: ssh to box, sudo there, open the file. Change `staging` to `production` and `C-x C-s`."
    demo: '~1500 C-x C-f ~500 C-a C-k ~300 "/ssh:box|sudo::/etc/app/app.env" ~1500 RET ~3000 M-< C-s ~300 "MODE=" ~300 RET C-k ~300 "production" ~500 C-x C-s ~2500'
    conditions:
      - text: the file is open through sudo
        state: { file: { regex: "sudo:(root@)?box:/etc/app/app\\.env$" } }
        hint: "Check the separators: /ssh:box then | then sudo:: then the path; a | joins the two hops. In the read-only buffer, M-x tramp-revert-buffer-with-sudo does the same."
      - text: C-x C-s saved it
        event: { command: save-buffer }
        hint: "Saving as root works without a password: the box lets deploy use sudo freely."
      - text: the box's app.env says MODE=production and still belongs to root
        shell: { host: box, run: "grep -qx MODE=production /etc/app/app.env && test \"$(stat -c %U /etc/app/app.env)\" = root", timeout: 15 }
        hint: "The line must read exactly MODE=production. TRAMP keeps the owner: the file stays root's."
