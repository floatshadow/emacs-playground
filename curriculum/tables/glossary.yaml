# Glossary for :jargon[term] tooltips in lesson.md (CURRICULUM.md Part B.2):
# term → one or two sentences. Terms are matched case-insensitively; a
# lesson may write :jargon[buffers] for the term "buffer" (a trailing s is
# ignored when the plural is not listed). validate.py checks that every
# :jargon term in a lesson is defined here.

buffer: "Text that Emacs holds in memory. Most buffers show a file; some, like *scratch* or a help page, do not."
window: "A pane inside the Emacs frame that shows one buffer. Splitting makes more windows; closing one never closes its buffer."
frame: "What your desktop calls a window: the whole Emacs screen. In the playground there is a terminal frame and, on demand, a graphical one."
mode line: "The bar under each window: buffer name, whether it is modified (**), the cursor position (L12 C4) and the active modes."
echo area: "The bottom line of the screen when Emacs is telling you something: messages, key prefixes in progress, short answers."
minibuffer: "The bottom line of the screen when Emacs is asking you something. It is a small buffer, so every editing key works in it."
point: "Emacs's name for the cursor position: always between two characters."
mark: "A second position you set with C-SPC. The text between the mark and point is the region."
region: "The text between the mark and point. When it is active it is highlighted, and commands like C-w act on it."
kill: "Emacs's word for cut. Killed text goes to the kill ring, so nothing is lost."
yank: "Emacs's word for paste. C-y yanks the latest kill; M-y right after it reaches older ones."
kill ring: "The list of text you killed or copied, newest first. Like a clipboard history."
major mode: "The one mode that defines how a buffer behaves: Rust, Markdown, Dired. Shown in parentheses in the mode line."
minor mode: "An optional feature switched on in a buffer or everywhere, such as line numbers or overwrite mode. Many can be on at once."
prefix key: "A key that starts a longer sequence, like C-x or C-h. After it, Emacs waits for the next key and which-key lists the choices."
prefix argument: "A number or C-u given before a command to change what it does: C-u 4 C-n moves four lines."
command: "A named function you can run with a key or with M-x. Every key runs one; C-h k tells you which."
key binding: "The link between a key sequence and a command. Modes add their own bindings; C-h b lists them all."
keymap: "A table of key bindings. Each mode has one, and prefix keys have their own."
which-key: "The popup that appears after a prefix key, listing every key that can follow and the command it runs."
special buffer: "A buffer made by Emacs rather than read from a file, like *Help* or *Messages*. Its name usually has stars; q usually closes it."
modified: "A buffer that differs from its file on disk. The mode line shows ** until you save."
read-only: "A buffer you cannot type into. The mode line shows %%; C-x C-q toggles it."
narrowing: "Showing only part of a buffer. The rest is hidden, not deleted; C-x n w shows it again."
overwrite mode: "A minor mode where typing replaces the characters under the cursor. Insert toggles it."
recursive edit: "Editing inside a command that is waiting for you, shown as [ ] around the mode name. C-M-c finishes it, C-] aborts it."
isearch: "Incremental search: Emacs finds the text while you type it. C-s forward, C-r backward, RET to stop there."
regexp: "A regular expression: a pattern such as p[0-9]+ that matches many strings. Emacs writes groups as \\( \\)."
sexp: "A balanced expression: a word, a number, a string, or anything between matching brackets. C-M-f jumps over one."
defun: "A top-level definition, usually a function. C-M-a and C-M-e go to its start and end in any language."
keyboard macro: "A recording of keys that Emacs can replay. F3 starts recording, F4 stops and then replays."
rectangle: "The columns between the mark and point, across several lines. C-x r commands act on it."
undo tree: "Every state a buffer has been in, as a tree. Undo in Emacs never throws history away; vundo (C-x u) draws it."
iedit: "Editing every occurrence of a symbol at once; C-; starts and ends it."
multiple cursors: "Several cursors that all act on each key you press; C-g goes back to one."
avy: "Jumping to any visible spot by typing a few of its characters and then a label letter (M-j)."
imenu: "The list of definitions in the current file (functions, types, headings). M-g i jumps to one."
Dired: "The directory editor: a buffer listing a folder, where keys act on files. C-x d opens it."
dirvish: "A nicer face for Dired with icons, a header and a side window (C-x C-j). The keys are Dired's."
ibuffer: "A buffer list you can mark, filter and act on, grouped by project. C-x C-b opens it."
project: "A folder Emacs treats as one unit, found by its version control or a marker such as Cargo.toml. C-x p is its prefix."
bookmark: "A named place in a file that survives restarts. C-x r m sets one, C-x r b jumps to one."
register: "A one-character slot that holds a position, some text or a window layout for this session. C-x r SPC and C-x r j."
recent files: "Files you opened before, remembered across restarts (recentf). C-x C-r lists them."
save-place: "Emacs remembers where the cursor was in every file and goes back there when you reopen it."
uniquify: "How Emacs names two buffers whose files have the same name: main.rs<hello> and main.rs<polyglot>."
completion: "Emacs finishing a name for you. TAB completes in prompts; the list shows what matches."
history: "Each prompt remembers what you typed. M-p and M-n step through it, M-r searches it."
side window: "A window glued to one edge of the frame, used for pop-ups. C-x w s hides and shows all of them."
display-buffer-alist: "The variable with the rules that decide where Emacs shows a buffer it pops up."
pop-up: "A buffer Emacs shows by itself: help, build output, search results. Lesson 3.5 decides where they go."
winner: "winner-mode remembers every window layout; C-c <left> goes back to the previous one."
tab: "In the tab bar, a whole window layout. Each tab keeps its own windows; buffers are shared."
compilation buffer: "*compilation*, where build output appears. RET on an error jumps to it."
xref: "Emacs's list of places: definitions, references, search matches. RET visits one, M-g M-n walks them."
eval: "Running Lisp. Emacs is configured and extended by evaluating Lisp, even while it runs."
daemon: "Emacs running in the background without a screen. The playground's frames connect to it, so closing a frame loses nothing."
Meta: "The M- in key names. Press Alt, or press and release Esc before the key."
Control: "The C- in key names: hold Control while pressing the key."
RET: "The Enter (Return) key."
DEL: "The Backspace key: it deletes the character before the cursor."
SPC: "The space bar."
TAB: "The Tab key; in prompts it completes."
ESC: "The Escape key. Esc then a key is the same as Meta with that key."
checkpoint: "A snapshot the playground takes of your files and windows when a step starts. Reset this step goes back to it."
Rescue: "The Rescue me button: leaves prompts, searches and macros, widens, and closes extra windows. It never touches your files."
ticker: "The strip under the screen that names every command your keys ran, with a short explanation."
