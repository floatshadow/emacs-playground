# Glossary for :jargon[term] tooltips in lesson.md (CURRICULUM.md Part B.2):
# term → one or two sentences. Terms are matched case-insensitively; a
# lesson may write :jargon[buffers] for the term "buffer" (a trailing s is
# ignored when the plural is not listed). validate.py checks that every
# :jargon term in a lesson is defined here.

buffer: "Text that Emacs holds in memory. Most buffers show a file; some, like *scratch* or a help page, do not."
window: "A pane inside the Emacs frame that shows one buffer. Splitting makes more windows; closing one never closes its buffer."
frame: "What your desktop calls a window: the whole Emacs screen. In the playground there is a terminal frame and, on demand, a graphical one."
mode line: "The bar under each window: buffer name, whether it is modified (**), the cursor position (L12 C4) and the active modes."
echo area: "The bottom line of the screen when Emacs is telling you something: messages, key prefixes in progress, short answers."
minibuffer: "The bottom line of the screen when Emacs is asking you something. It is a small buffer, so every editing key works in it."
point: "Emacs's name for the cursor position: always between two characters."
mark: "A second position you set with C-SPC. The text between the mark and point is the region."
region: "The text between the mark and point. When it is active it is highlighted, and commands like C-w act on it."
kill: "Emacs's word for cut. Killed text goes to the kill ring, so nothing is lost."
yank: "Emacs's word for paste. C-y yanks the latest kill; M-y right after it reaches older ones."
kill ring: "The list of text you killed or copied, newest first. Like a clipboard history."
major mode: "The one mode that defines how a buffer behaves: Rust, Markdown, Dired. Shown in parentheses in the mode line."
minor mode: "An optional feature switched on in a buffer or everywhere, such as line numbers or overwrite mode. Many can be on at once."
prefix key: "A key that starts a longer sequence, like C-x or C-h. After it, Emacs waits for the next key and which-key lists the choices."
prefix argument: "A number or C-u given before a command to change what it does: C-u 4 C-n moves four lines."
command: "A named function you can run with a key or with M-x. Every key runs one; C-h k tells you which."
key binding: "The link between a key sequence and a command. Modes add their own bindings; C-h b lists them all."
keymap: "A table of key bindings. Each mode has one, and prefix keys have their own."
which-key: "The popup that appears after a prefix key, listing every key that can follow and the command it runs."
special buffer: "A buffer made by Emacs rather than read from a file, like *Help* or *Messages*. Its name usually has stars; q usually closes it."
modified: "A buffer that differs from its file on disk. The mode line shows ** until you save."
read-only: "A buffer you cannot type into. The mode line shows %%; C-x C-q toggles it."
narrowing: "Showing only part of a buffer. The rest is hidden, not deleted; C-x n w shows it again."
overwrite mode: "A minor mode where typing replaces the characters under the cursor. Insert toggles it."
recursive edit: "Editing inside a command that is waiting for you, shown as [ ] around the mode name. C-M-c finishes it, C-] aborts it."
isearch: "Incremental search: Emacs finds the text while you type it. C-s forward, C-r backward, RET to stop there."
regexp: "A regular expression: a pattern such as p[0-9]+ that matches many strings. Emacs writes groups as \\( \\)."
sexp: "A balanced expression: a word, a number, a string, or anything between matching brackets. C-M-f jumps over one."
defun: "A top-level definition, usually a function. C-M-a and C-M-e go to its start and end in any language."
keyboard macro: "A recording of keys that Emacs can replay. F3 starts recording, F4 stops and then replays."
rectangle: "The columns between the mark and point, across several lines. C-x r commands act on it."
undo tree: "Every state a buffer has been in, as a tree. Undo in Emacs never throws history away; vundo (C-x u) draws it."
iedit: "Editing every occurrence of a symbol at once; C-; starts and ends it."
multiple cursors: "Several cursors that all act on each key you press; C-g goes back to one."
avy: "Jumping to any visible spot by typing a few of its characters and then a label letter (M-j)."
imenu: "The list of definitions in the current file (functions, types, headings). M-g i jumps to one."
Dired: "The directory editor: a buffer listing a folder, where keys act on files. C-x d opens it."
dirvish: "A nicer face for Dired with icons, a header and a side window (C-x C-j). The keys are Dired's."
ibuffer: "A buffer list you can mark, filter and act on, grouped by project. C-x C-b opens it."
project: "A folder Emacs treats as one unit, found by its version control or a marker such as Cargo.toml. C-x p is its prefix."
bookmark: "A named place in a file that survives restarts. C-x r m sets one, C-x r b jumps to one."
register: "A one-character slot that holds a position, some text or a window layout for this session. C-x r SPC and C-x r j."
recent files: "Files you opened before, remembered across restarts (recentf). C-x C-r lists them."
save-place: "Emacs remembers where the cursor was in every file and goes back there when you reopen it."
uniquify: "How Emacs names two buffers whose files have the same name: main.rs<hello> and main.rs<polyglot>."
completion: "Emacs finishing a name for you. TAB completes in prompts; the list shows what matches."
history: "Each prompt remembers what you typed. M-p and M-n step through it, M-r searches it."
side window: "A window glued to one edge of the frame, used for pop-ups. C-x w s hides and shows all of them."
display-buffer-alist: "The variable with the rules that decide where Emacs shows a buffer it pops up."
pop-up: "A buffer Emacs shows by itself: help, build output, search results. Lesson 3.5 decides where they go."
winner: "winner-mode remembers every window layout; C-c <left> goes back to the previous one."
tab: "In the tab bar, a whole window layout. Each tab keeps its own windows; buffers are shared."
compilation buffer: "*compilation*, where build output appears. RET on an error jumps to it."
xref: "Emacs's list of places: definitions, references, search matches. RET visits one, M-g M-n walks them."
eval: "Running Lisp. Emacs is configured and extended by evaluating Lisp, even while it runs."
daemon: "Emacs running in the background without a screen. The playground's frames connect to it, so closing a frame loses nothing."
Meta: "The M- in key names. Press Alt, or press and release Esc before the key."
Control: "The C- in key names: hold Control while pressing the key."
RET: "The Enter (Return) key."
DEL: "The Backspace key: it deletes the character before the cursor."
SPC: "The space bar."
TAB: "The Tab key; in prompts it completes."
ESC: "The Escape key. Esc then a key is the same as Meta with that key."
checkpoint: "A snapshot the playground takes of your files and windows when a step starts. Reset this step goes back to it."
Rescue: "The Rescue me button: leaves prompts, searches and macros, widens, and closes extra windows. It never touches your files."
ticker: "The strip under the screen that names every command your keys ran, with a short explanation."

# --- p9 ---
Org: "Org mode: plain-text files with headings, TODO items, tables and runnable code blocks, and the tools that work on them (agenda, export)."
subtree: "An Org heading together with its body and every heading below it. Org folds, moves, cuts and narrows subtrees as one piece."
agenda: "The Org agenda: a view built from the TODO items, schedules and deadlines of all your Org files. It is a buffer, not a file."
capture: "Org capture: write a note or task from wherever you are and file it into an Org file without leaving what you were doing."
timestamp: "A date in angle brackets, like <2026-11-02 Mon>. After SCHEDULED: or DEADLINE: it puts the heading on the agenda on that day."
tag: "A word between colons at the end of an Org heading, like :writing:. The agenda can collect everything with one tag."
Babel: "The part of Org that runs code blocks and puts their results into the file, passing results from one block to the next."
code block: "Lines between #+begin_src LANGUAGE and #+end_src in an Org file. C-c C-c runs it; its output appears under #+RESULTS:."
tangle: "Write the code blocks of an Org file out to source files (C-c C-v t), so prose and code live in one document."
export: "Turn an Org file into another format, such as HTML, PDF through LaTeX, Beamer slides or Markdown (C-c C-e)."
org-roam: "A package that keeps a network of small Org notes linked by id, with a list of backlinks for each note."
backlink: "A link to the note you are reading from another note. org-roam lists them in its side buffer."
literate configuration: "A configuration written as an Org document: prose that explains each setting, with the code in blocks tangled to .el files."

# --- p11 ---
hook: "A list of functions Emacs runs at a known moment: when a mode starts, after a save, when a build finishes. Packages connect by adding functions to each other's hooks."
wdired: "Writable Dired: C-x C-q in a listing makes the file names editable text; C-c C-c renames the files as edited."
indirect buffer: "A second buffer that shares its text with another (C-x 4 c). Edits show in both, but each has its own cursor, narrowing and mode."
user-lisp: "The folder emacs.d/user-lisp/ for your own Emacs Lisp. Emacs 31 compiles it at startup and loads only what its ;;;###autoload lines name."

# --- p8 ---
label: "A name such as eq:1 or sec:model attached to a numbered thing in LaTeX with \\label{...}, so the text can refer to it with \\ref{...} and the number follows when things move."
input method: "A way of typing characters that are not on the keyboard: while it is on, what you type is converted, such as \\alpha to α (TeX) or pinyin to Chinese (pyim). C-\\ turns it on and off."

# --- p10 ---
ediff: "Emacs's tool for comparing two or three versions of a file, one difference at a time, and merging them."
RPN: "Reverse Polish notation: numbers first, then the operation. 2 RET 3 + is 2 + 3. Calc works this way unless you type a formula after '."
TRAMP: "The part of Emacs that opens files and runs commands on other machines through paths such as /ssh:box:/var/log."
REPL: "Read-eval-print loop: a prompt where you type an expression, it is evaluated, and the value is printed. ielm is Emacs's own."

# --- p4-5 ---
candidate: "One entry in a completion list: a command, file, buffer or line you can pick with RET."
vertico: "The vertical completion list in every prompt (Part 4): C-n and C-p move, RET picks, M-RET takes what you typed."
orderless: "The matching rule of the completion list: space-separated words in any order, ! to exclude a word, = to match it literally."
marginalia: "The notes beside each candidate in a list: a command's key and documentation, a file's size and age."
consult: "Searching commands built on the completion list, with a live preview: M-s l lines, M-s r the project, M-g i definitions."
embark: "Acting on things: C-. offers actions for the thing at point or the highlighted candidate, like a right-click menu."
corfu: "The completion popup in buffers: candidates appear under the cursor as you type; RET or TAB takes one."
cape: "Extra completion sources for the popup: words from your buffers (Dabbrev) and file names (File)."
tempel: "The snippet engine: M-+ inserts a template whose fields you fill in, moving between them with TAB."
snippet: "A template of code with fields to fill in, such as a function's name, parameters and body."
Magit: "A Git client inside Emacs. C-x g opens the status of the current repository; single letters stage, commit, branch and more."
hunk: "One block of changed lines in a diff, with a few unchanged lines around it. Magit stages and discards hunk by hunk."
staging area: "Git's list of changes for the next commit (also called the index). s in Magit adds the change at point to it, u takes it out."
smerge: "The minor mode for files with merge conflicts: C-c ^ keys keep one version or both, conflict by conflict."
diff-hl: "Marks in the margin for lines changed since the last commit, with keys to jump between those changes and revert one."
git-timemachine: "A read-only view of a file as it was at any commit: p and n step through its history, q leaves (C-x v t)."

# --- p6-7 ---
next-error: "The command behind M-g M-n: it walks any list of locations (build errors, search matches, references), opening each at its line."
terminal emulator: "A program that behaves like a terminal, so shells and full-screen programs run in it. eat and vterm do this inside an Emacs buffer."
Eshell: "A shell written in Emacs Lisp: shell commands, Lisp and Emacs commands on one command line. M-x eshell."
language server: "A program that understands one language for any editor: completion, definitions, references, errors. rust-analyzer, ocaml-lsp, basedpyright."
Eglot: "Emacs's built-in client for language servers. It starts the right server for a project and turns its answers into Emacs features."
eldoc: "Shows what is known about the thing at point (signature, type, problems) in the echo area; C-h . opens it in full."
inlay hint: "Grey text a language server adds in the code, such as a variable's type. It is not in the file."
diagnostic: "An error, warning or note a checker reports at a place in the code. Flymake shows them."
formatter: "A program that rewrites code into its standard layout: rustfmt, ocamlformat, ruff."
virtual environment: "A project's own Python and packages, usually in .venv. uv creates it; pet finds it."
breakpoint: "A line where the debugger stops the program, so you can look at its values. C-x C-a b."
expect test: "A test that prints something and states what it should print; dune shows the difference and can accept the new output."

# --- proj-5-8 ---
directory-local variables: "Settings in a .dir-locals.el file that apply to every file under its directory, such as the compile command of one project root."

# --- p12-13 ---
default directory: "The folder a buffer belongs to (default-directory). Programs started from the buffer run there, so in a remote buffer they run on the remote machine."
multi-hop: "A TRAMP path that chains connections with |, such as /ssh:box|sudo::/etc/hosts: ssh to box, then sudo there."
package archives: "Servers that offer Emacs packages to package.el: GNU ELPA, NonGNU ELPA and MELPA."
theme: "A named set of colours and styles for every face. M-x load-theme turns one on."
face: "A named text style: font, size, colour, weight. Themes set faces; M-x describe-face shows the one under the cursor."

# --- proj-1-4 ---
SyncTeX: "A map between a LaTeX source and its PDF, written during the build, so the editor can jump from a line to its place in the PDF and back."
annotated tag: "A git tag with its own message, author and date, the usual kind for releases. A plain tag is only a name for a commit."
