# Ticker glosses (frontend.md §6): command name → a short plain-language
# gloss shown under the chord. Commands missing here fall back to the first
# docstring line through rpc describe. Every command that a lesson in
# Parts 0-3 mentions or checks has an entry (curriculum/tools/validate.py
# checks the event conditions against this table).

# --- Always there -----------------------------------------------------
self-insert-command: Insert the character you typed
undefined: This key does nothing here
execute-extended-command: Run any command by name
keyboard-quit: Cancel whatever is in progress
keyboard-escape-quit: "Get out of everything: prompt, extra windows, recursive edits"
abort-minibuffers: Cancel the prompt
minibuffer-keyboard-quit: Cancel the prompt
abort-recursive-edit: Cancel the prompt or recursive edit
exit-recursive-edit: Finish the recursive edit
top-level: Leave every prompt and recursive edit
universal-argument: Give the next command a number or a variant
digit-argument: Part of a number for the next command
negative-argument: Make the next command's number negative
playground-rescue: "Rescue: leave prompts, searches and extra windows"
save-buffers-kill-terminal: Close this frame (the playground reopens it)
suspend-frame: Suspend Emacs to the shell (off in the playground)
emacs-version: Show which Emacs this is
repeat: Repeat the last command
quoted-insert: Insert the next key literally
newline: Insert a line break
open-line: Insert a line break after the cursor, staying put
electric-newline-and-maybe-indent: Insert a line break and indent
indent-for-tab-command: Indent this line
delete-char: Delete the character under the cursor
delete-backward-char: Delete the character before the cursor
delete-forward-char: Delete the character under the cursor
transpose-chars: Swap the two characters around the cursor
overwrite-mode: Toggle overwrite mode (typing replaces text)
read-only-mode: Toggle read-only for this buffer
count-words: Count lines, words and characters
what-line: Show the line number
whitespace-mode: Show spaces, tabs and line ends
display-line-numbers-mode: Toggle line numbers
comment-dwim: Comment or uncomment the region or line
comment-line: Comment or uncomment this line

# --- Help (0.3) ---------------------------------------------------------
help-command: "Help: press a key for the kind of help"
help-for-help: List every help command
describe-key: Explain what a key does
describe-key-briefly: Name the command a key runs
describe-function: Explain a command or function by name
describe-variable: Explain a setting (a variable) by name
describe-symbol: Explain anything by name
describe-mode: Explain the current major and minor modes
describe-bindings: List every key binding available here
describe-char: Explain the character under the cursor
view-lossage: Show the last keys you pressed
help-with-tutorial: Open the built-in tutorial
help-view-source: Open the source code of what help describes
help-follow: Follow the link under the cursor
help-go-back: Back to the previous help page
help-go-forward: Forward to the next help page
push-button: Press the button or link under the cursor
info: Open the manuals (Info)
display-local-help: Show the help text at the cursor
helpful-key: Explain what a key does (helpful)
helpful-callable: Explain a command or function (helpful)
helpful-variable: Explain a setting (helpful)
quit-window: Close this special window and go back

