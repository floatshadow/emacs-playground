ibuffer-do-view: "Buffer list: show the marked buffers"
ibuffer-visit-buffer: "Buffer list: open the buffer on this line"
ibuffer-filter-by-filename: "Buffer list: show only files matching"
ibuffer-filter-by-mode: "Buffer list: show only one mode"
ibuffer-filter-by-used-mode: "Buffer list: show only one mode"
ibuffer-filter-by-file-extension: "Buffer list: show only an extension"
ibuffer-filter-disable: "Buffer list: remove every filter"
Buffer-menu-this-window: Open the buffer on this line here
recentf-open: Open a recently used file
recentf-open-files: List recently used files
consult-recent-file: Open a recently used file, with preview
consult-buffer: Switch buffer, recent file or bookmark, with preview

