# Layer 1 of the advice engine (architecture.md §4, CURRICULUM.md Part B.4):
# "Where am I" rows, evaluated in order against the latest state object
# (api.md §5). Every matching row is shown as a reason (why) and one exit
# (how). Rows are ordered from the most disorienting state to the least.
#
# Row fields (protocol.ExitRow):
#   id    stable id
#   when  protocol.Predicate: dotted paths into the state, all must hold.
#         scalar = equality, list = membership, or one operator object:
#         {in: [...]}, {not: v}, {gt|gte|lt|lte: n}, {exists: bool},
#         {contains: v}, {regex: "re"}. Paths over a list match ANY element;
#         "windows.length" is a count; virtual roots: otherWindows,
#         selectedWindow. Quote keys that contain dots.
#   why   template, {path} placeholders resolved against the state; for a
#         path through a list, the element that satisfied `when` is used
#   how   template; key names are rendered as keycaps by the browser
#   flag  optional short chip (Narrow, Def, Ovwrt)
#
# Virtual root `session` (browser side, frontend.md §6): some states are
# not in the agent's state object but in the event stream. The browser's
# exits.ts adds them to the document before evaluating these rows:
#   session.prefix  the pending prefix from the tap ("C-x", "C-x r"), or
#                   null when no prefix is pending (`prefix` events)
#   session.emacs   the supervisor condition from the latest `emacs` event
#                   that is still current: "frame-closed", "suspended",
#                   "restarting", "unresponsive", or null once the frame is
#                   open and Emacs responsive again
#   session.mode    the frame the browser shows: "terminal" or "gui"
#   session.echo    the text of the latest `echo` event while it is still
#                   shown (until the next key event), or null
#
# Localise per file: exits.zh-CN.yaml with the same ids.

# --- The frame itself -------------------------------------------------

- id: frame-closed
  when: { "session.emacs": frame-closed }
  why: "The Emacs frame was closed (C-x C-c closes the frame you are in)."
  how: "Wait a moment: the playground opens it again with every buffer as it was. On your own machine, C-x C-c quits Emacs."

- id: suspended
  when: { "session.emacs": suspended }
  why: "Emacs was suspended (C-z or C-x C-z send it to the background)."
  how: "The playground resumes it. In a plain terminal you would type fg. Undo is C-/, not C-z."

- id: restarting
  when: { "session.emacs": restarting }
  why: "Emacs is restarting, usually to turn on the modules of a new part of the course."
  how: "Wait a few seconds. Your files, windows and positions come back."

- id: unresponsive
  when: { "session.emacs": unresponsive }
  why: "Emacs is busy and has not answered for a while."
  how: "C-g interrupts most long commands. If nothing changes, press Rescue me."

# --- Waiting for you ----------------------------------------------------

# A loop that reads keys of its own (state `waiting`): every key goes to it,
# and nothing else in the state shows it.
- id: menu-open
  when: { "waiting.kind": menu }
  why: "A menu is open: every key goes to it until it closes."
  how: "C-g (or ESC ESC ESC) closes it. Arrow keys and RET pick an item. Rescue me closes it too."

- id: avy-waiting
  when: { "waiting.kind": avy }
  why: "avy is waiting for the characters of the place to jump to; the letters on the screen mark the candidates."
  how: "Type the letters shown at your target, or C-g to stay where you are."

- id: which-key-pages
  when: { "waiting.kind": which-key }
  why: "which-key is showing pages of the keys that can follow the prefix."
  how: "n and p turn the pages, a aborts (C-g only goes back to the prefix)."

# C-h has a row of its own (VS Code users press it for replace); the
# generic row's regex is every pending prefix but exactly C-h.
- id: help-prefix
  when: { "session.prefix": C-h }
  why: "C-h is the help prefix (not replace, as in VS Code): Emacs is waiting for the next key."
  how: "k explains a key, f a function, m the current modes; the popup lists the rest. C-g cancels. Replace is M-%."

- id: prefix-pending
  when: { "session.prefix": { regex: "^([^C]|C[^-]|C-[^h]|C-h.)" } }
  why: "{session.prefix} is a prefix: Emacs is waiting for the next key."
  how: "Press the next key of the command, or C-g to cancel. The popup lists what can follow."

- id: describe-key-waiting
  when: { "session.echo": { regex: "^Describe the following key" } }
  why: "C-h k is waiting for a key to explain."
  how: "Press the key you are curious about; it is explained, not run. C-g cancels."

# query-replace asks at each match through the echo area, not the
# minibuffer, so only the echo shows this phase.
- id: query-replace-match
  when: { "session.echo": { regex: "^(Query replacing|Replacing)" } }
  why: "A replace stopped at the highlighted match and waits for one key."
  how: "y replaces this match, n skips it, ! replaces all the rest, q or RET stops. C-g stops too; afterwards C-/ undoes the replacements made."

- id: prefix-argument
  when: { prefixArg: { not: null } }
  why: "A numeric argument ({prefixArg}) is waiting for the command it applies to."
  how: "Type the command (C-u 4 C-n moves four lines), or C-g to drop the argument."

- id: isearch
  when: { isearch: true }
  why: "You are searching (I-search at the bottom): {minibuffer.contents}"
  how: "RET stops at this match. C-s goes to the next one, C-r back. C-g jumps back to where you started."

- id: minibuffer-nested
  when: { "minibuffer.kind": prompt, "minibuffer.depth": { gte: 2 } }
  why: "Prompts are open inside prompts, {minibuffer.depth} deep."
  how: "C-g closes the innermost one. ESC ESC ESC closes them all."

# Prompt rows: one per kind of question, so that a prompt matches exactly
# one of them; tools/validate.py checks this against the real Emacs 31
# prompts in its EXIT_PROMPT_SAMPLES. The browser evaluates these regular
# expressions with JavaScript and sessiond with Go (RE2): write them so
# both read them alike, without inline flags such as (?i) (spell case out
# with classes, [Ff]ile) and without lookaround. Questions, whose prompts
# end with a ? and the answers, stay out of the name rows through anchors
# or a trailing [^?]*$. minibuffer-prompt is the rest: its regex is the
# union of all the others.

- id: minibuffer-mx
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "M-x" } }
  why: "M-x is waiting for a command name."
  how: "Type part of the name, TAB completes, RET runs it. C-g cancels."

- id: minibuffer-yes-no
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "\\((y or n|yes or no)\\)" } }
  why: "Emacs asks a question: {minibuffer.prompt}"
  how: "Answer y or n. C-g cancels the whole command."

- id: minibuffer-choice
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "\\((y, n|yes, no)," } }
  why: "Emacs asks a question with several answers: {minibuffer.prompt}"
  how: "Press one key: y for yes, n for no, or another answer from the list (! means yes to all the rest, q stops). ? or C-h explains each answer. C-g cancels."

- id: minibuffer-file
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "^(Find|Write|Insert|Visit|Open)\\b.*\\b(file|directory)\\b|^Dired|^Create directory|^(Copy|Rename|Move|Symlink) .+ to: $" } }
  why: "Emacs is asking for a file or folder: {minibuffer.prompt}{minibuffer.contents}"
  how: "Type a name, TAB completes, RET accepts. A / after the path starts over from the root, ~/ from home. C-g cancels."

- id: minibuffer-buffer
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "^[A-Z][a-z]+( to| in| from)? buffer\\b" } }
  why: "Emacs is asking for a buffer name: {minibuffer.prompt}"
  how: "RET alone takes the default shown in the prompt. TAB lists the buffers. C-g cancels."

- id: minibuffer-number
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "^(Goto|Go to) (line|char)|([Ll]ine number|[Cc]olumn|[Cc]ounter|[Nn]umber)[^?]*$" } }
  why: "Emacs is asking for a number: {minibuffer.prompt}"
  how: "Type a number, RET. C-g cancels."

- id: minibuffer-help
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "^(Describe|Where is|Search for a command|Apropos)" } }
  why: "Help is asking what to explain: {minibuffer.prompt}"
  how: "Type the name, TAB completes it, RET shows the help. C-g cancels."

- id: minibuffer-bookmark
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "[Bb]ookmark[^?]*$" } }
  why: "Emacs is asking for a bookmark name: {minibuffer.prompt}"
  how: "Type a name, TAB completes the existing ones, RET accepts. RET alone takes the default shown. C-g cancels."

- id: minibuffer-search
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "^(List lines|Flush lines|Keep lines|How many|Highlight)\\b[^?]*regexp" } }
  why: "Emacs is asking what to look for: {minibuffer.prompt}"
  how: "Type the text, RET. It is a regular expression, so . and * and [ have special meanings. RET alone takes the default shown. C-g cancels."

- id: minibuffer-replace
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { regex: "[Rr]eplac[^?]*$" } }
  why: "A replace command is asking what to replace, and with what."
  how: "Type the text, RET, the replacement, RET. Then y replaces, n skips, ! replaces all, q stops."

- id: minibuffer-prompt
  when: { "minibuffer.kind": prompt, "minibuffer.prompt": { not: { regex: "M-x|\\((y or n|yes or no)\\)|\\((y, n|yes, no),|^(Find|Write|Insert|Visit|Open)\\b.*\\b(file|directory)\\b|^Dired|^Create directory|^(Copy|Rename|Move|Symlink) .+ to: $|^[A-Z][a-z]+( to| in| from)? buffer\\b|^(Goto|Go to) (line|char)|([Ll]ine number|[Cc]olumn|[Cc]ounter|[Nn]umber)[^?]*$|^(Describe|Where is|Search for a command|Apropos)|[Bb]ookmark[^?]*$|^(List lines|Flush lines|Keep lines|How many|Highlight)\\b[^?]*regexp|[Rr]eplac[^?]*$" } } }
  why: "A prompt is open at the bottom: {minibuffer.prompt}"
  how: "RET accepts, C-g cancels. M-p brings back what you typed before."

- id: recursive-edit
  when: { recursive: { gt: 0 }, minibuffer: null }
  why: "A recursive edit is running: square brackets [ ] around the mode name."
  how: "C-M-c finishes it, C-] aborts it. ESC ESC ESC also gets out."

- id: macro
  when: { macro: true }
  why: "Recording a keyboard macro (Def in the mode line). Every key you press is recorded."
  how: "F4 stops recording. C-g throws the recording away."
  flag: Def

# --- Modes that change what typing does ------------------------------

- id: overwrite
  when: { overwrite: true }
  why: "Overwrite mode: typing replaces the text under the cursor (Ovwrt in the mode line)."
  how: "Press Insert, or M-x overwrite-mode RET, to go back to inserting."
  flag: Ovwrt

- id: multiple-cursors
  when: { minors: { contains: multiple-cursors-mode } }
  why: "Several cursors are active: every key you press acts at each of them."
  how: "C-g goes back to one cursor."
  flag: mc

- id: iedit
  when: { minors: { contains: iedit-mode } }
  why: "iedit is on: editing one highlighted occurrence edits all of them."
  how: "C-; again turns it off and keeps the edits."
  flag: Iedit

- id: rectangle
  when: { minors: { contains: rectangle-mark-mode } }
  why: "You are selecting a rectangle (C-x SPC): columns, not lines."
  how: "C-x r k kills it, C-x r t replaces it with text, C-g cancels the selection."

- id: narrowed
  when: { narrowed: true }
  why: "Narrowed: you see only part of this buffer (Narrow in the mode line). The rest is still there."
  how: "C-x n w shows everything again."
  flag: Narrow

- id: view-mode
  when: { minors: { contains: view-mode } }
  why: "View mode: {buf} is open for reading; SPC scrolls and typing does not edit."
  how: "q leaves view mode. C-x C-q makes the buffer editable."
  flag: View

- id: read-only-file
  when: { readOnlyReason: { in: [read-only-mode, "file is write-protected"] }, file: { regex: "^[^:]+$" } }
  why: "{buf} is read-only (%% in the mode line), so typing does nothing."
  how: "C-x C-q makes it writable, if you really mean to edit it."
  flag: "%%"

- id: wdired
  when: { mode: wdired-mode }
  why: "You are editing file names in the listing (wdired). Nothing is renamed yet."
  how: "C-c C-c renames the files as edited. C-c ESC throws the edits away."

- id: region
  when: { markActive: true }
  why: "A region is active: the highlighted text between the mark and the cursor."
  how: "Commands like C-w, M-w and M-% act on it; typing replaces it. C-g deactivates it."

# --- Special buffers in the selected window -------------------------

- id: dired
  when: { mode: { in: [dired-mode, dirvish-mode] } }
  why: "This is Dired, a listing of a folder (you opened a directory)."
  how: "RET opens the file on the line, ^ goes up a folder, q closes the listing."

- id: ibuffer
  when: { mode: ibuffer-mode }
  why: "This is the buffer list (ibuffer): every buffer Emacs holds, grouped by project."
  how: "RET opens the buffer on the line. m marks, D kills marked buffers, S saves them. q closes the list."

- id: buffer-menu
  when: { mode: Buffer-menu-mode }
  why: "This is the plain buffer list (C-x C-b)."
  how: "RET opens the buffer on the line, q closes the list."

- id: help
  when: { mode: { in: [help-mode, helpful-mode, apropos-mode] } }
  why: "You are reading help ({buf})."
  how: "q closes it. On a link, RET follows it; l goes back; s shows the source of a command."

- id: info
  when: { mode: Info-mode }
  why: "You are reading the manual (Info)."
  how: "q closes it. SPC reads on, n and p go to the next and previous node, l goes back."

- id: tutorial
  when: { buf: TUTORIAL }
  why: "This is the Emacs tutorial, an ordinary buffer you can type in."
  how: "C-x k RET closes it (answer n when asked to save your place). C-x b goes back to your file."

- id: compilation
  when: { mode: compilation-mode }
  why: "This is build output (*compilation*)."
  how: "RET on an error jumps to it, g runs the build again, q closes the window."

- id: grep
  when: { mode: grep-mode }
  why: "These are search results (grep)."
  how: "RET visits a match; M-g M-n walks them from any buffer. q closes the window."

- id: occur
  when: { mode: occur-mode }
  why: "These are the lines that matched (occur)."
  how: "RET visits a line; M-g M-n walks them from any buffer. e edits them in place. q closes."

- id: xref
  when: { mode: xref--xref-buffer-mode }
  why: "This is a list of matches or references (xref)."
  how: "RET visits a match, n and p preview them. q closes the list."

- id: bookmarks
  when: { mode: bookmark-bmenu-mode }
  why: "This is the bookmark list."
  how: "RET jumps to the bookmark on the line, d flags it for deletion and x deletes. q closes the list."

- id: vundo
  when: { mode: vundo-mode }
  why: "This is the undo tree (vundo): every state the buffer has been in."
  how: "b and f walk back and forward, RET keeps the state you are on, q quits where you started."

- id: magit
  when: { mode: { in: [magit-status-mode, magit-log-mode, magit-diff-mode, magit-revision-mode, magit-refs-mode, magit-stash-mode] } }
  why: "This is Magit ({modeName})."
  how: "? lists every key, g refreshes, q closes. Nothing is committed until you confirm with C-c C-c."

- id: commit-message
  when: { buf: { regex: "COMMIT_EDITMSG" } }
  why: "You are writing a commit message."
  how: "C-c C-c commits, C-c C-k cancels the commit."

- id: eshell
  when: { mode: eshell-mode }
  why: "This is Eshell, a shell written in Emacs Lisp."
  how: "Type commands at the prompt. C-c C-c interrupts the running one. C-x b goes back to your files."

- id: eat
  when: { mode: eat-mode }
  why: "This is a terminal (eat): most keys go to the program running in it."
  how: "C-c C-e switches to Emacs keys to move and copy, C-c C-j back. C-x b leaves the terminal running."

- id: completions
  when: { mode: completion-list-mode }
  why: "The cursor is in the list of completions."
  how: "RET picks the candidate on the line. C-g goes back to the prompt."

- id: messages
  when: { mode: messages-buffer-mode }
  why: "This is *Messages*, the log of everything the echo area said."
  how: "q closes it. C-x b goes back to your file."

- id: scratch
  when: { buf: "*scratch*" }
  why: "This is *scratch*, a buffer for notes and Lisp. It is not a file and is not saved."
  how: "C-x b goes back to your file. C-x C-f opens one."

# --- Windows, tabs and frames ---------------------------------------

# frames counts the daemon's own invisible frame: the terminal frame alone
# is 2, and GUI mode adds its graphical frame. Either screen shows one frame
# at a time (the graphical one has no window manager), so a frame made with
# C-x 5 2 hides the one underneath.
- id: extra-frame
  when: { frames: { gte: 3 }, "session.mode": terminal }
  why: "Another frame now covers this one (C-x 5 2). The windows you had are in the frame underneath."
  how: "C-x 5 0 closes this frame and brings the other back. C-x 5 o switches between them."

- id: extra-frame-gui
  when: { frames: { gte: 4 }, "session.mode": gui }
  why: "Another graphical frame now lies over this one (C-x 5 2). The windows you had are in the frame underneath."
  how: "C-x 5 0 closes this frame and brings the other back. C-x 5 o switches between them."

- id: other-window-special
  when: { "otherWindows.mode": { in: [help-mode, helpful-mode, apropos-mode, Info-mode, Buffer-menu-mode, ibuffer-mode, compilation-mode, grep-mode, occur-mode, xref--xref-buffer-mode, dired-mode, bookmark-bmenu-mode, vundo-mode, magit-status-mode, magit-diff-mode, magit-log-mode, eshell-mode, eat-mode, messages-buffer-mode, completion-list-mode] }, "windows.side": { not: { in: [left, right, top, bottom] } } }
  why: "Another window shows {otherWindows.buf}."
  how: "Press q inside it (C-x o gets you there), or C-x 1 here to keep only this window."

- id: side-window
  when: { "windows.side": { in: [left, right, top, bottom] } }
  why: "A side window is open on the {windows.side} edge, showing {windows.buf}."
  how: "C-x w s hides and shows side windows. C-x 1 keeps them; q inside one closes it."

- id: many-windows
  when: { "windows.length": { gte: 3 } }
  why: "The frame is split into {windows.length} windows."
  how: "C-x o moves between them. C-x 0 closes this one, C-x 1 keeps only this one."

- id: two-windows
  when: { "windows.length": 2, "otherWindows.mode": { not: { in: [help-mode, helpful-mode, apropos-mode, Info-mode, Buffer-menu-mode, ibuffer-mode, compilation-mode, grep-mode, occur-mode, xref--xref-buffer-mode, dired-mode, bookmark-bmenu-mode, vundo-mode, magit-status-mode, magit-diff-mode, magit-log-mode, eshell-mode, eat-mode, messages-buffer-mode, completion-list-mode] } } }
  why: "The frame is split into two windows."
  how: "C-x o moves between them. C-x 0 closes this one, C-x 1 keeps only this one."

- id: tabs
  when: { "tabs.count": { gte: 2 } }
  why: "There are {tabs.count} tabs; this one is {tabs.current}. Each keeps its own windows."
  how: "C-x t o goes to the next tab, C-x t RET to one by name, C-x t 0 closes this tab (buffers stay)."

- id: gui-frame
  when: { frame: gui }
  why: "You are in the graphical frame: the same Emacs and the same buffers, drawn with images and mouse menus."
  how: "Switch back with the Terminal tab above the screen. Your buffers and windows come along; tabs made here do not."

# --- Information ------------------------------------------------------

- id: diagnostic
  when: { "diagAtPoint.severity": { in: [error, warning] } }
  why: "There is a {diagAtPoint.severity} here: {diagAtPoint.message}"
  how: "C-h . shows it in full. M-g n and M-g p move between problems."

# --- p8 ---

- id: eww
  when: { mode: eww-mode }
  why: "This is eww, the web browser inside Emacs, showing {buf}."
  how: "g reloads the page, l goes back, q closes the window. C-x o returns to the source."

- id: pdf-view
  when: { mode: pdf-view-mode }
  why: "This is a PDF drawn by Emacs (pdf-tools)."
  how: "n and p turn pages, + and - zoom, o shows the outline, C-s searches. q closes the window."

- id: pdf-outline
  when: { mode: pdf-outline-buffer-mode }
  why: "This is the outline of a PDF, its table of contents."
  how: "RET goes to the heading, M-RET goes there and closes the outline, q closes it without moving."

- id: pdf-text
  when: { mode: doc-view--text-view-mode }
  why: "This is the text of a PDF: the terminal frame cannot draw its pages."
  how: "The graphical frame shows the pages. q closes the text."

- id: image
  when: { mode: image-mode }
  why: "This is an image file, {buf}, drawn by Emacs."
  how: "i + and i - zoom, i r rotates, n and p show the folder's next and previous images. C-c C-c shows an SVG's text. q closes."

- id: image-dired
  when: { mode: image-dired-thumbnail-mode }
  why: "These are thumbnails of a folder's images (image-dired)."
  how: "The arrow keys move, RET shows the image full size, q closes the thumbnails."

- id: reftex-select
  when: { mode: { in: [reftex-select-label-mode, reftex-select-bib-mode] } }
  why: "RefTeX is asking which label to refer to."
  how: "n and p move between labels, RET inserts the reference, q gives up."

- id: tex-output
  when: { mode: TeX-output-mode }
  why: "This is the output of a LaTeX build."
  how: "C-c ` jumps to the next error in the source. q closes the window."

- id: tex-help
  when: { "otherWindows.buf": "*TeX Help*" }
  why: "*TeX Help* explains the LaTeX error the cursor is on."
  how: "Fix the line and build again with C-c C-c. C-c ` goes to the next error; C-x 1 closes the help."

- id: typst-output
  when: { mode: typst-ts-compilation-mode }
  why: "This is Typst's build output ({buf})."
  how: "RET on an error jumps to it in the source. q closes the window; C-x o goes back."

# --- p9 ---

- id: org-select
  when: { buf: "*Org Select*" }
  why: "Org is asking which template or block you want: one key from the list."
  how: "Press the key in brackets ([t] for a Task). q or C-g cancels."

- id: org-export-dispatcher
  when: { buf: "*Org Export Dispatcher*" }
  why: "This is the export menu: a letter picks the format, a second letter what to make."
  how: "h o makes HTML and opens it, l p a PDF, m m Markdown. q or C-g closes the menu."

- id: org-agenda-dispatcher
  when: { buf: " *Agenda Commands*" }
  why: "This is the agenda menu: one key picks the view."
  how: "a shows the week, t every open TODO, m the headings with a tag you name. q closes the menu."

- id: org-date-prompt
  when: { "minibuffer.kind": prompt, "windows.buf": "*Calendar*" }
  why: "Org is asking for a date; the calendar shows the day you are picking."
  how: "Type +1 for tomorrow, fri for the next Friday, or move the day with S-<right> and S-<left>, then RET. C-g cancels."

- id: org-capture
  when: { minors: { contains: org-capture-mode } }
  why: "You are writing a captured note; it is not filed yet."
  how: "C-c C-c files it and takes you back, C-c C-k throws it away, C-c C-w files it under another heading."

- id: org-src
  when: { minors: { contains: org-src-mode } }
  why: "You are editing a code block of an Org file in a buffer of its own."
  how: "C-c ' puts it back into the Org file, C-c C-k throws the edits away."

- id: org-agenda
  when: { mode: org-agenda-mode }
  why: "This is the Org agenda, collected from your Org files. It is a view, not a file."
  how: "RET visits the item, t changes its state, q closes the agenda and puts the windows back."

- id: org-roam-backlinks
  when: { "otherWindows.mode": org-roam-mode }
  why: "The side window lists the notes that link to this one (org-roam)."
  how: "RET on a backlink visits it. C-c n l closes the window."

- id: org-babel-error
  when: { "otherWindows.buf": "*Org-Babel Error Output*" }
  why: "A code block failed; {otherWindows.buf} shows what the program printed."
  how: "Fix the block (C-c ' edits it) and run it again with C-c C-c. C-x 1 closes the error window."

# --- p11 ---

- id: wgrep
  when: { mode: grep-mode, readonly: false }
  why: "You are editing the search results (wgrep). The files change only when you finish."
  how: "C-c C-c writes every changed line into its file and saves it. C-c C-k throws the edits away."

- id: archive
  when: { mode: { in: [tar-mode, archive-mode] } }
  why: "This is the list of files inside the archive {buf}. Nothing has been extracted."
  how: "RET opens a member as a buffer. After saving members, C-x C-s here writes the archive. q closes the list."

- id: archive-member
  when: { buf: { regex: " \\([^()]+\\.(tar|tgz|zip|jar|tar\\.gz)\\)(<[^>]*>)?$" } }
  why: "{buf} is a file inside an archive, opened without extracting it."
  how: "C-x C-s saves it back into the archive's buffer; then save the archive itself with C-x C-s in its list."

- id: edit-indirect
  when: { buf: { regex: "^\\*edit-indirect " } }
  why: "You are editing a code block of a document in a buffer of its own ({buf})."
  how: "C-c C-c puts it back into the document, C-c C-k throws the edits away."

# --- p10 ---
- id: ediff
  when: { mode: ediff-mode }
  why: "This is ediff's control window: two versions side by side, walked one difference at a time."
  how: "n and p walk the differences, a and b copy one side over the other, ? lists every key, q quits (it asks first)."

- id: ediff-elsewhere
  when: { mode: { not: ediff-mode }, "otherWindows.buf": { regex: "^\\*Ediff Control Panel" } }
  why: "An ediff comparison is open; its keys work only in the control window, the strip at the bottom."
  how: "C-x o until the cursor is in the control window, then n, p, a, b or q."

- id: calc
  when: { mode: { in: [calc-mode, calc-trail-mode] } }
  why: "This is Calc, a stack calculator: 2 RET 3 + adds. Letters are commands here, not text."
  how: "U undoes, ' types a formula, C-x * c or q closes Calc."

- id: ielm
  when: { mode: inferior-emacs-lisp-mode }
  why: "This is ielm, a Lisp prompt for this Emacs: RET evaluates the expression at the ELISP> prompt."
  how: "M-p brings back earlier input. C-x b goes back to your files."

- id: occur-edit
  when: { mode: occur-edit-mode }
  why: "You are editing the matching lines (occur-edit): each change goes straight into the buffer the line came from."
  how: "C-c C-c goes back to the read-only list. The changed files save themselves a few seconds later."

- id: re-builder
  when: { mode: reb-mode }
  why: "This is re-builder: the regexp you type here lights up its matches in the buffer above."
  how: "C-c C-w copies the regexp, C-c C-q quits re-builder."

- id: edit-macro
  when: { mode: edmacro-mode }
  why: "You are editing a keyboard macro as text: one key per line, the command after ;; is only a comment."
  how: "C-c C-c keeps the edited macro, C-x k RET throws the edit away."

- id: proced
  when: { mode: proced-mode }
  why: "This is proced, the list of processes on this machine, like top."
  how: "g refreshes, k sends a signal to the process on the line, q closes the list."

- id: timer-list
  when: { mode: timer-list-mode }
  why: "This is the list of timers: Lisp that Emacs will run later or repeatedly."
  how: "c cancels the timer on the line, q closes the list."

# --- p4-5 ---

- id: smerge
  when: { minors: { contains: smerge-mode } }
  why: "This file has merge conflicts (smerge): <<<<<<< marks where each one starts, ======= separates the two versions."
  how: "C-c ^ n goes to the next conflict; C-c ^ u keeps the upper version, C-c ^ l the lower, C-c ^ a both."

- id: magit-log-select
  when: { mode: magit-log-select-mode }
  why: "Magit wants you to pick a commit from this list."
  how: "Move to the commit and press C-c C-c. C-c C-k cancels."

- id: git-rebase
  when: { mode: git-rebase-mode }
  why: "This is the plan of an interactive rebase: the commits to replay, oldest first, one action per line."
  how: "s squashes a commit into the one above, f fixes it up, d drops it, M-p and M-n move it. C-c C-c runs the rebase, C-c C-k abandons it."

- id: magit-blame
  when: { minors: { contains: magit-blame-mode } }
  why: "Blame is on: each heading names the commit that last changed the lines below it. The buffer is read-only meanwhile."
  how: "RET shows that commit, n and p move between headings, q turns blame off (one level at a time)."

- id: git-timemachine
  when: { minors: { contains: git-timemachine-mode } }
  why: "This is an old version of {buf} (git-timemachine). The file itself has not changed."
  how: "p and n step through the versions, M-w copies, q closes the time machine."

- id: magit-process
  when: { mode: magit-process-mode }
  why: "This is the log of the Git commands Magit ran."
  how: "An error from Git is shown here in full. q closes it."

- id: with-editor
  when: { minors: { contains: with-editor-mode }, buf: { not: { regex: "COMMIT_EDITMSG|git-rebase-todo" } } }
  why: "Git is waiting for you to finish editing {buf}."
  how: "C-c C-c finishes, C-c C-k cancels."

# embark-act reads its action key with the target named in the echo area.
- id: embark-act
  when: { "session.echo": { regex: "^Act on " } }
  why: "Embark waits for one key: the action for the target named at the bottom."
  how: "Press an action key (d deletes a file, k kills a buffer, w copies). C-h lists every action for this target; C-g cancels."

- id: embark-collect
  when: { mode: embark-collect-mode }
  why: "This is a list collected by embark (C-. S)."
  how: "RET runs the default action on a candidate, C-. acts on it with any action. q closes the list."

# --- p6-7 ---

- id: vterm
  when: { mode: vterm-mode }
  why: "This is a terminal (vterm): most keys go to the program running in it."
  how: "C-c C-t switches to copy mode, where Emacs keys move and copy; C-c C-t again goes back. C-x b leaves the terminal running."

- id: python-repl
  when: { mode: inferior-python-mode }
  why: "This is a Python REPL ({buf})."
  how: "Type Python and RET. M-p brings back earlier input. C-c C-z in your Python file comes back here; C-x b goes back to it."

- id: utop
  when: { mode: utop-mode }
  why: "This is utop, the OCaml toplevel."
  how: "End a phrase with ;; and press RET. M-p brings back earlier input. C-c C-z goes back to the source file."

- id: dape
  when: { mode: { regex: "^dape-" } }
  why: "This window belongs to the debugger (dape)."
  how: "C-x C-a n steps, C-x C-a s steps in, C-x C-a o out, C-x C-a c continues, C-x C-a q ends the session."

- id: flymake-list
  when: { mode: { in: [flymake-diagnostics-buffer-mode, flymake-project-diagnostics-mode] } }
  why: "This is the list of problems the checkers found (Flymake)."
  how: "RET goes to a problem. The list updates as you fix them; q closes it."

- id: eldoc-buffer
  when: { buf: "*eldoc*" }
  why: "This is *eldoc*: what is known about the thing at point in your code, problems first."
  how: "q closes it. It follows the cursor in your code; C-h . opens it again."

- id: shell-command-output
  when: { buf: { regex: "^\\*(Async Shell Command|Shell Command Output)\\*" } }
  why: "This is the output of a shell command (M-! or M-&)."
  how: "C-x 0 closes this window, C-x b goes back to your file. In an async one, C-c C-c interrupts the command if it still runs."

# --- p12-13 ---

- id: remote-unsaved
  when: { file: { regex: "^/[a-z]+:" }, modified: true }
  why: "{buf} lives on another machine (TRAMP), and the playground saves only local files for you."
  how: "C-x C-s saves it over the connection; the bottom line then says Wrote /ssh:..."

- id: remote-read-only
  when: { readonly: true, file: { regex: "^/ssh:[^|]+:/" } }
  why: "{buf} belongs to another user on the remote machine, often root, so you may read it but not write it."
  how: "M-x tramp-revert-buffer-with-sudo reopens it as root (/ssh:host|sudo::/path). C-x C-q would let you type, not save."

- id: customize
  when: { mode: Custom-mode }
  why: "This is Customize, a form for options: edit a field or press a button, then apply."
  how: "TAB moves between buttons and fields, RET presses one. C-x C-s applies what you changed and saves it to custom.el; q closes."

- id: package-menu
  when: { mode: package-menu-mode }
  why: "This is the package list: what the archives offer and what is installed."
  how: "RET describes the package on the line; i marks it for installation, d for deletion, U every upgrade; x does what is marked. q closes."
