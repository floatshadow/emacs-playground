# Crates prefetched into the session image (emacs.md section 9) so that
# lessons and projects build with no network: `cargo fetch --locked` puts
# them and their dependencies into the image's registry cache, which is
# copied to $CARGO_HOME when a container starts.
#
# To offer another crate: add it below, run `cargo generate-lockfile` in
# this directory (it rewrites Cargo.lock; commit both), rebuild the image.
# A fixture's Cargo.lock must resolve to versions listed in Cargo.lock
# here (or omit Cargo.lock; cargo then resolves offline from the cache).
[package]
name = "playground-prefetch"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
