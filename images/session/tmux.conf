# tmux configuration for the terminal frame (emacs.md section 5).
# Installed as /etc/tmux.conf, so every tmux server in the session image
# reads it, including sessiond's (tmux -L pg).
#
# The learner never interacts with tmux.  It exists so the terminal frame
# survives browser reconnects and so `make shell` (or any terminal) can
# attach to the same Emacs.  There is no prefix key, no status line, no
# key binding and no scrollback: every key and mouse event goes to Emacs.

# --- Terminal --------------------------------------------------------------
set -g default-terminal "tmux-256color"
# The browser terminal (xterm.js, TERM=xterm-256color) supports true
# colour, extended keys, OSC 52 clipboard and hyperlinks.
set -as terminal-features ",xterm*:RGB:extkeys:clipboard:hyperlinks"

# Keys: forward modified keys (C-;, C-RET, C-S-s, C-M-%) to Emacs as
# CSI u sequences whether or not Emacs asked; kkp decodes them
# (modules/base.el).
set -s extended-keys always
set -s extended-keys-format csi-u
# ESC is a key of its own; never wait to see whether a sequence follows.
set -s escape-time 0
set -s focus-events on

# Clipboard: Emacs sets the selection with OSC 52, tmux passes it on to
# xterm.js.  Passthrough lets other escape sequences through untouched.
set -s set-clipboard on
set -g allow-passthrough on
set -g allow-rename off
set -g set-titles off

# --- No tmux user interface ---------------------------------------------
set -g status off
set -g prefix None
set -g prefix2 None
unbind -a
# The root table too (status-line and border mouse menus).
unbind -a -T root
set -g history-limit 0
set -g window-size latest
set -g mouse on
# Mouse events always go to Emacs (xterm-mouse-mode): no copy mode, no
# tmux menus, no pane selection.
bind -n MouseDown1Pane send -M
bind -n MouseDown2Pane send -M
bind -n MouseDown3Pane send -M
bind -n M-MouseDown3Pane send -M
bind -n MouseDrag1Pane send -M
bind -n MouseDragEnd1Pane send -M
bind -n WheelUpPane send -M
bind -n WheelDownPane send -M
bind -n DoubleClick1Pane send -M
bind -n TripleClick1Pane send -M

# --- Control+Shift+letter ------------------------------------------------
# tmux 3.5a forwards C-; C-RET C-M-% and friends to Emacs as CSI u, but
# it turns Control+Shift+letter into plain Control+letter (C-S-s arrives
# as C-s).  These bindings re-send each one as the CSI u sequence kkp
# decodes (ESC [ <code> ; 6 u, the code of the lower-case letter).  Both
# spellings are bound: the kitty protocol reports the lower-case letter,
# xterm's modifyOtherKeys the upper-case one.  They only see keys typed
# through an attached client (the browser, `make shell'), which is the
# point; `tmux send-keys' bypasses them.
bind -n C-S-a send-keys -H 1b 5b 39 37 3b 36 75
bind -n C-S-A send-keys -H 1b 5b 39 37 3b 36 75
bind -n C-S-b send-keys -H 1b 5b 39 38 3b 36 75
bind -n C-S-B send-keys -H 1b 5b 39 38 3b 36 75
bind -n C-S-c send-keys -H 1b 5b 39 39 3b 36 75
bind -n C-S-C send-keys -H 1b 5b 39 39 3b 36 75
bind -n C-S-d send-keys -H 1b 5b 31 30 30 3b 36 75
bind -n C-S-D send-keys -H 1b 5b 31 30 30 3b 36 75
bind -n C-S-e send-keys -H 1b 5b 31 30 31 3b 36 75
bind -n C-S-E send-keys -H 1b 5b 31 30 31 3b 36 75
bind -n C-S-f send-keys -H 1b 5b 31 30 32 3b 36 75
bind -n C-S-F send-keys -H 1b 5b 31 30 32 3b 36 75
bind -n C-S-g send-keys -H 1b 5b 31 30 33 3b 36 75
bind -n C-S-G send-keys -H 1b 5b 31 30 33 3b 36 75
bind -n C-S-h send-keys -H 1b 5b 31 30 34 3b 36 75
bind -n C-S-H send-keys -H 1b 5b 31 30 34 3b 36 75
bind -n C-S-i send-keys -H 1b 5b 31 30 35 3b 36 75
bind -n C-S-I send-keys -H 1b 5b 31 30 35 3b 36 75
bind -n C-S-j send-keys -H 1b 5b 31 30 36 3b 36 75
bind -n C-S-J send-keys -H 1b 5b 31 30 36 3b 36 75
bind -n C-S-k send-keys -H 1b 5b 31 30 37 3b 36 75
bind -n C-S-K send-keys -H 1b 5b 31 30 37 3b 36 75
bind -n C-S-l send-keys -H 1b 5b 31 30 38 3b 36 75
bind -n C-S-L send-keys -H 1b 5b 31 30 38 3b 36 75
bind -n C-S-m send-keys -H 1b 5b 31 30 39 3b 36 75
bind -n C-S-M send-keys -H 1b 5b 31 30 39 3b 36 75
bind -n C-S-n send-keys -H 1b 5b 31 31 30 3b 36 75
bind -n C-S-N send-keys -H 1b 5b 31 31 30 3b 36 75
bind -n C-S-o send-keys -H 1b 5b 31 31 31 3b 36 75
bind -n C-S-O send-keys -H 1b 5b 31 31 31 3b 36 75
bind -n C-S-p send-keys -H 1b 5b 31 31 32 3b 36 75
bind -n C-S-P send-keys -H 1b 5b 31 31 32 3b 36 75
bind -n C-S-q send-keys -H 1b 5b 31 31 33 3b 36 75
bind -n C-S-Q send-keys -H 1b 5b 31 31 33 3b 36 75
bind -n C-S-r send-keys -H 1b 5b 31 31 34 3b 36 75
bind -n C-S-R send-keys -H 1b 5b 31 31 34 3b 36 75
bind -n C-S-s send-keys -H 1b 5b 31 31 35 3b 36 75
bind -n C-S-S send-keys -H 1b 5b 31 31 35 3b 36 75
bind -n C-S-t send-keys -H 1b 5b 31 31 36 3b 36 75
bind -n C-S-T send-keys -H 1b 5b 31 31 36 3b 36 75
bind -n C-S-u send-keys -H 1b 5b 31 31 37 3b 36 75
bind -n C-S-U send-keys -H 1b 5b 31 31 37 3b 36 75
bind -n C-S-v send-keys -H 1b 5b 31 31 38 3b 36 75
bind -n C-S-V send-keys -H 1b 5b 31 31 38 3b 36 75
bind -n C-S-w send-keys -H 1b 5b 31 31 39 3b 36 75
bind -n C-S-W send-keys -H 1b 5b 31 31 39 3b 36 75
bind -n C-S-x send-keys -H 1b 5b 31 32 30 3b 36 75
bind -n C-S-X send-keys -H 1b 5b 31 32 30 3b 36 75
bind -n C-S-y send-keys -H 1b 5b 31 32 31 3b 36 75
bind -n C-S-Y send-keys -H 1b 5b 31 32 31 3b 36 75
bind -n C-S-z send-keys -H 1b 5b 31 32 32 3b 36 75
bind -n C-S-Z send-keys -H 1b 5b 31 32 32 3b 36 75

# --- The frame comes back when it closes -----------------------------------
# C-x C-c (or a daemon restart) ends emacsclient.  The pane stays (dead)
# and is respawned with the same command a quarter of a second later, so
# the browser's attached client never sees the session end.  Use
# /opt/playground/bin/pg-terminal-frame as the pane command: it waits for
# the daemon instead of failing while Emacs restarts.  sessiond sets a
# session-level pane-died hook, which replaces this global one, and
# respawns the pane itself.
set -g remain-on-exit on
set -g remain-on-exit-format "The Emacs frame closed; reopening it..."
set-hook -g pane-died 'run-shell -C -d 0.25 "respawn-pane -k -t #{hook_pane}"'
