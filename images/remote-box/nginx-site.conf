# The box's web server (deployment.md §6): serves what P5 deploys to
# /srv/www, so `curl http://box/` from the session shows the site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /srv/www;
    index index.html;
    server_name _;
    location / {
        try_files $uri $uri/ =404;
    }
}
